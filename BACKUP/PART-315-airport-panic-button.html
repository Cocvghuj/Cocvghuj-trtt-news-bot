<!-- PART-315 Last Minute Airport Panic Button -->
<div style="text-align: center; margin: 15px 0;">
  <button onclick="panic()" style="background: #dc2626; color: #ffffff; padding: 15px 20px; border-radius: 50px; border: 0; width: 100%; max-width: 450px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3); display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
    🚨 PANIC - FCO Land করেছি, এখন Hotel লাগবে!
  </button>
  <div id="panicStatus" style="font-size: 11px; color: #64748b; margin-top: 6px;">
    Emergency instant booking via TRTT Marker 787950
  </div>
</div>

<script>
// PART-315 Airport Panic Engine
function panic() {
  const statusEl = document.getElementById('panicStatus');
  if (statusEl) {
    statusEl.innerText = "⚡ TRTT Panic Activated! Finding Hotel + Taxi + eSIM in 3 min...";
    statusEl.style.color = "#dc2626";
    statusEl.style.fontWeight = "bold";
  }

  alert('TRTT Panic Activated! Finding Hotel + Taxi + eSIM in 3 min... Marker 787950');
  
  // Anti-Data Loss Persistence
  try {
    localStorage.setItem('trtt_panic', Date.now());
    localStorage.setItem('trtt_panic_active', 'true');
  } catch(e) {}

  window.open('https://aviasales.tpo.lv?marker=787950&to=FCO_PANIC', '_blank');
}
</script>
