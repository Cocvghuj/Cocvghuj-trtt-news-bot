<!-- PART-309 PWA Push Notification sw.js -->
<div class="push-box" style="border: 2px solid #16a34a; background: #f0fdf4; padding: 14px; border-radius: 12px; margin: 10px 0; text-align: center;">
  <h4 style="margin: 0 0 6px 0; color: #15803d;">🔔 Enable Trip Alert Push Notifications</h4>
  <p style="margin: 0 0 10px 0; font-size: 13px; color: #166534;">ট্রিপের তারিখ ও ক্যাশব্যাক অফারের অটো অ্যালার্ট পেতে নোটিফিকেশন অন কর:</p>
  
  <button id="pushBtn" onclick="enablePush()" style="background: #16a34a; color: #ffffff; border: 0; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px;">
    🔔 Enable Notifications
  </button>
  
  <div id="pushStatus" style="font-size: 11px; color: #15803d; margin-top: 8px;"></div>
</div>

<script>
// PART-309 Engine
function enablePush() {
  const statusEl = document.getElementById('pushStatus');

  if (!("Notification" in window)) {
    if (statusEl) statusEl.innerText = "❌ আপনার ব্রাউজারে নোটিফিকেশন সাপোর্ট করে না।";
    return;
  }

  Notification.requestPermission().then(p => {
    if (p === 'granted') {
      if (statusEl) statusEl.innerText = "✅ নোটিফিকেশন অ্যাক্টিভ করা হয়েছে!";
      
      // টেস্ট নোটিফিকেশন পাঠানো
      new Notification("তোর Rome Trip কাল - Leonardo Ticket Ready?", {
        body: "Book via TRTT Marker 787950 & Earn Cashback!",
        icon: "https://picsum.photos/seed/rome1/100/100"
      });

      // LocalStorage Anti-Data Loss Sync
      try {
        localStorage.setItem('trtt_push_enabled', 'true');
        localStorage.setItem('trtt_push_time', new Date().toISOString());
      } catch(e) {}

    } else if (p === 'denied') {
      if (statusEl) statusEl.innerText = "⚠️ নোটিফিকেশন পারমিশন ব্লকেড করা আছে।";
    }
  });
}
</script>
