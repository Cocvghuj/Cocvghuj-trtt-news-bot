<!-- PART-305 Referral Leaderboard -->
<div class="leaderboard" style="border: 2px solid #006ce4; background: #f0f7ff; padding: 15px; border-radius: 12px; margin: 10px 0;">
  <h4 style="margin: 0 0 8px 0; color: #003580;">🏆 TRTT Referral Leaderboard</h4>
  <p style="margin: 0 0 10px 0; font-size: 14px;">তোর Link এ ৩ জন বুক করলে তুই TRTT Celebrity - Earn €7</p>
  
  <div style="background: #e2e8f0; border-radius: 10px; height: 10px; overflow: hidden; margin-bottom: 8px;">
    <div id="leaderProgress" style="background: #16a34a; height: 100%; width: 0%;"></div>
  </div>
  
  <div id="leaderStatus" style="font-size: 12px; font-weight: bold; color: #475569;">
    Checking referral count...
  </div>
</div>

<script>
(function(){
  try {
    const rawBookings = localStorage.getItem('trtt_verified_bookings') || '0';
    let count = 0;

    if (rawBookings.startsWith('[')) {
      count = JSON.parse(rawBookings).length;
    } else {
      count = parseInt(rawBookings) || 0;
    }

    console.log("Leaderboard - You:", count);

    const progressEl = document.getElementById('leaderProgress');
    const statusEl = document.getElementById('leaderStatus');

    const percentage = Math.min((count / 3) * 100, 100);
    if (progressEl) progressEl.style.width = percentage + '%';

    if (statusEl) {
      if (count >= 3) {
        statusEl.innerHTML = '🎉 Congratulations! You are now a TRTT Celebrity! (Earned €7)';
        statusEl.style.color = '#16a34a';
      } else {
        statusEl.innerHTML = 'Referrals: ' + count + ' / 3 (Need ' + (3 - count) + ' more)';
      }
    }

    localStorage.setItem('trtt_leaderboard_status', JSON.stringify({ count: count, celebrity: count >= 3 }));
  } catch(e) {
    console.warn("Leaderboard error:", e);
  }
})();
</script>
