<!-- PART-307 AI Itinerary to Affiliate Link -->
<div class="ai-itinerary-box" style="border: 2px dashed #006ce4; background: #ffffff; padding: 16px; border-radius: 12px; margin: 10px 0;">
  <h4 style="margin: 0 0 8px 0; color: #003580;">🤖 TRTT AI Travel Itinerary & Cashback Planner</h4>
  
  <div style="display: flex; gap: 8px; margin-bottom: 10px;">
    <input id="aiDestInput" type="text" placeholder="Gantiye lekhun: Rome, Milan, Dhaka..." style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px;">
    <button onclick="generateAIItinerary()" style="background: #006ce4; color: #fff; border: 0; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px;">Plan Trip</button>
  </div>

  <div id="aiOutputResult" style="font-size: 13px; line-height: 1.6; color: #0f172a; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;">
    Gantiye likhe 'Plan Trip' e click korun...
  </div>
</div>

<script>
// PART-307 Engine
function runAI(dest) {
  const destination = dest || 'Rome';
  return `<b>AI Verified Itinerary for ${destination}:</b><br>
  • Hotel Deal: <a href="https://aviasales.tpo.lv?marker=787950&hotel=${destination}" target="_blank" style="color:#16a34a; font-weight:bold; text-decoration:underline;">Book Hotel & Get €7 Cashback</a><br>
  • Local Transport: Airport Express Train & Bus pass included<br>
  • Connectivity: Airalo Data eSIM ready<br>
  <span style="font-size:11px; color:#64748b;">(All routes secured via TRTT Marker 787950)</span>`;
}

function generateAIItinerary() {
  const inputEl = document.getElementById('aiDestInput');
  const outputEl = document.getElementById('aiOutputResult');
  const dest = (inputEl && inputEl.value.trim()) ? inputEl.value.trim() : 'Rome';
  
  const resultHTML = runAI(dest);
  if (outputEl) outputEl.innerHTML = resultHTML;

  // LocalStorage Anti-Data Loss Save
  try {
    localStorage.setItem('trtt_ai_last_query', JSON.stringify({ destination: dest, timestamp: new Date().toISOString() }));
  } catch(e) {}
}

// Default run
generateAIItinerary();
</script>
