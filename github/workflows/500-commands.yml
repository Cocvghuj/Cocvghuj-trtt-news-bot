name: 500 COMMANDS FULL + DAILY NEWS - 3x
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7,13,19 * * *'  # Italy 8AM, 2PM, 8PM = দিনে 3 টা
  workflow_dispatch:

permissions:
  contents: write

jobs:
  all-500:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with: { fetch-depth: 0 }

      - name: RUN 500 COMMANDS + NEWS
        run: |
          GMAIL="engrtaher2017@gmail.com"
          MARKER="787950"
          DATE=$(date +"%Y-%m-%d %H:%M")
          
          echo "=== NEWS BOT - $DATE - Marker $MARKER LOCKED ==="
          
          # --- DAILY NEWS PART (দিনে 3 টা) ---
          mkdir -p news
          COUNT=$(ls news/*.md 2>/dev/null | wc -l)
          NEXT=$((COUNT+1))
          
          cat > news/news-$NEXT-$(date +%Y%m%d-%H).md << EOF
          # ✈️ TRTT News #$NEXT - $DATE - Sanluri to World
          
          **Marker 787950 LOCKED | tp.st ONLY | tIZcbMOB FIXED**
          
          ## 🛫 Today from Cagliari
          - Cheap Flight: [Aviasales tp.st](https://aviasales.tp.st/Fb8U9yav?marker=$MARKER&subid=trtt_lock_it)
          - eSIM: [Airalo tp.st](https://airalo.tp.st/ZZoQC7Mz?marker=$MARKER&subid=trtt_lock_it)
          - Taxi: [Kiwitaxi tp.st tIZcbMOB FIXED](https://kiwitaxi.tp.st/tIZcbMOB?marker=$MARKER&subid=trtt_lock_it)
          
          ## 🌍 Travel Tip
          Sanluri -> Cagliari Airport -> Rome FCO. Use trtt_lock_it tracking.
          
          ## 🔗 10 Programs Full Stack
          Aviasales, Klook, Airalo, Saily, Yesim, Drimsim, Kiwitaxi FIXED, Trip, Tiqets, AirHelp
          
          *Auto generated - $DATE - Owner $GMAIL - GDPR OK - Real .it Only*
          EOF
          
          # --- 500 COMMANDS PART (আগেরটা) ---
          mkdir -p BACKUP/03_old-files/00_legacy-all-old
          for i in $(seq 1 100); do echo "Cmd $i old files"; done
          for i in $(seq 101 200); do echo "Cmd $i SEO"; done
          for i in $(seq 201 300); do echo "Cmd $i Marker $MARKER tp.st tIZcbMOB"; done
          for i in $(seq 301 400); do echo "Cmd $i App PWA"; done
          for i in $(seq 401 500); do echo "Cmd $i Business Funnel"; done
          
          echo -e "User-agent: *\nAllow: /\nSitemap: https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/sitemap.xml" > robots.txt
          
          # Commit
          git config user.name "TRTT Bot"
          git config user.email "$GMAIL"
          git add .
          git commit -m "News #$NEXT - $DATE - 3x daily - Marker 787950 LOCKED tp.st tIZcbMOB FIXED" || true
          git push || true
