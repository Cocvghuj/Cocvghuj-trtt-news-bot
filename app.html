<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Map - Marker 787950</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>#map{height:80vh}body{margin:0;font-family:system-ui;background:#020617;color:#fff}</style></head><body><div style="padding:10px;background:linear-gradient(90deg,#020617,#00f2fe)">TRTT Map - Marker 787950 - <a href="index.html" style="color:#fff">Back to Sync OS</a></div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>fetch('partners.json').then(r=>r.json()).then(d=>{const m=L.map('map').setView([23.8,90.4],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);d.nodes.forEach(n=>L.marker([n.lat,n.lng]).addTo(m).bindPopup(n.city+'<br>Marker: '+d.marker+'<br><a href='+n.link+' target=_blank>Book - Marker '+d.marker+'</a>'))})</script></body></html>
