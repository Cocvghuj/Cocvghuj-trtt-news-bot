name: Blogger to Base44 Auto
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  blog-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Blogger RSS
        run: |
          curl -fsSL "https://trttvoyagehub.blogspot.com/feeds/posts/default?alt=json&max-results=5" \
            -o blog.json || echo '{"status":"offline","posts":[]}' > blog.json

          mkdir -p blog
          echo "<html><body><h1>Blog Sync $(date)</h1></body></html>" > blog/index.html

      - name: Commit
        run: |
          git config user.name "TRTT Bot"
          git config user.email "trtt@voyagehub.com"
          git add .
          git diff --cached --quiet || (git commit -m "Auto Blog Sync 787950 - $(date +%Y-%m-%d)" && git push)
