# Dev-only nginx config used by docker-compose.base44.yml (mounted as
# /etc/nginx/nginx.conf). Serves the checked-out static site from
# /usr/share/nginx/html with caching disabled so bind-mounted edits are visible
# on the next reload.
#
# Workers run as root on purpose: the checkout can be owned by a single user
# with restrictive permissions, which would otherwise make nginx answer 403.
# This is a local dev server, never a production one.
user root;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    sendfile      on;
    keepalive_timeout 65;
    access_log    /var/log/nginx/access.log;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        # Preview/dev: never let the browser reuse a stale page.
        add_header Cache-Control "no-store, must-revalidate" always;

        location / {
            try_files $uri $uri/ =404;
        }

        # Scripts and docs are not site assets; keep them out of the preview.
        location ~* \.(py|md|ya?ml)$ {
            return 404;
        }
    }
}
