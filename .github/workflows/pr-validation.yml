name: PR Asset & Syntax Validation

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run TRTT tests
        run: |
          npm install
          npm test

      - name: Verify production build output
        run: npm run build
