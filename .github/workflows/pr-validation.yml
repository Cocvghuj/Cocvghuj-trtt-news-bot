name: PR Asset & Syntax Validation

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Blogger theme XML
        run: python scripts/validate_blogger_theme.py

      - name: Run TRTT tests
        run: |
          npm install
          npm test
          python -m unittest discover -s tests -p "test_draft_news.py"

      - name: Verify production build output
        run: npm run build
