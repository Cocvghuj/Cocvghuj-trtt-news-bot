name: TRTT 787950 LOCKED - 1 PER DAY ONLY

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: trtt-787950-locked
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests google-generativeai

      - name: 1 Per Day - Topic+Date Check - Unsplash+Gemini+Blogger
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRAVEL_PAYOUT_MARKER: ${{ secrets.TRAVEL_PAYOUT_MARKER }}
        run: |
          python3 << 'PY'
          import os, json, datetime, requests
          from datetime import timezone
          import pathlib

          # 7 Topics
          topics = [
            ("flight_sanluri_rome","Sanluri to Rome 19 Euro - Aviasales","flight rome","https://aviasales.tp.st/Fb8U9yav"),
            ("bus_via_carlo_felice","Via Carlo Felice to Elmas 5 Euro","bus sardinia","https://www.arst.sardegna.it"),
            ("esim_sardinia","Airalo eSIM 5 Euro QR","esim phone","https://airalo.tp.st/ZZoQC7Mz"),
            ("hotel_termini","Rome Termini 50 Euro - Klook","hotel rome","https://klook.tp.st/TWKnemhz"),
            ("claim_600","AirHelp 600 Euro","airport delay","https://airhelp.tp.st/3ItXS0E4"),
            ("gear_backpack","Amazon Backpack","backpack travel","https://amazon.com"),
            ("colosseum_skip","Colosseum Skip Line","colosseum","https://klook.tp.st/TWKnemhz"),
          ]
          today = datetime.date.today().isoformat()
          day = datetime.datetime.now(timezone.utc).weekday()
          topic_id, title, query, base = topics[day]
          marker = os.getenv("TRAVEL_PAYOUT_MARKER","787950")
          print(f"Today {today} Topic {topic_id} Marker {marker}")

          # NEW DUPLICATE CHECK - Topic + Date, not MD5
          pathlib.Path("posts").mkdir(exist_ok=True)
          posted_file="posts/posted.json"
          posted={}
          if os.path.exists(posted_file):
            try: posted=json.load(open(posted_file))
            except: posted={}
          # posted = {"2026-10-27": "flight_sanluri_rome"} format
          if posted.get(today) == topic_id:
            print(f"ALREADY POSTED TODAY {today} - {topic_id} - Skip to prevent 3 posts")
            exit(0)
          if today in posted:
            print(f"Today {today} already has {posted[today]} - Skip")
            exit(0)

          # Unsplash with token
          unsplash_key=os.getenv("UNSPLASH_ACCESS_KEY")
          img1="https://images.unsplash.com/photo-1553062407-98eeb64c6a62"
          img2="https://images.unsplash.com/photo-1622560480605-d83c853bc5c3"
          if unsplash_key:
            try:
              r=requests.get(f"https://api.unsplash.com/search/photos?query={query}&per_page=2&client_id={unsplash_key}", timeout=15)
              if r.status_code==200 and r.json().get("results"):
                img1=r.json()["results"][0]["urls"]["regular"]
                if len(r.json()["results"])>1:
                  img2=r.json()["results"][1]["urls"]["regular"]
                print("UNSPLASH OK with token")
            except Exception as e:
              print(f"Unsplash err {e}")

          # Gemini
          gemini_key=os.getenv("GEMINI_API_KEY")
          news=""
          if gemini_key:
            try:
              import google.generativeai as genai
              genai.configure(api_key=gemini_key)
              model=genai.GenerativeModel("gemini-1.5-flash")
              prompt=f"I am from Sanluri Via Carlo Felice, 3 months tested, ARST 08:17 5 Euro 45min, topic {title} {topic_id}, 600+ words, E-E-A-T Ripu Abu Taher, marker {marker} LOCKED, disclosure, max 3 links ?marker={marker}&sub_id=MY_GUIDE_{topic_id}_{marker}, real experience"
              news=model.generate_content(prompt).text
              print(f"GEMINI {len(news)} chars")
            except Exception as e:
              print(f"Gemini err {e}")
          if len(news)<400:
            news=f"I am from Sanluri Via Carlo Felice tested 3 months ARST 08:17 5 Euro 45min to Elmas. Topic {title} {topic_id} marker {marker} real experience. " * 20

          link1=f"{base}?marker={marker}&sub_id=MY_GUIDE_{topic_id}_{marker}"
          link2=f"https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/?marker={marker}&sub_id=HUB_{marker}"
          html=f"<p>Advertiser disclosure: My guides contain marker {marker}. I am from Sanluri, Via Carlo Felice.</p><div>{news}</div><img src='{img1}' alt='Best {topic_id} {marker}'/><img src='{img2}' alt='Via Carlo Felice {marker}'/><p><a href='{link1}'>{title} {marker}</a><br><a href='{link2}'>Hub {marker}</a></p>"

          # Blogger
          try:
            cid=os.getenv("BLOGGER_CLIENT_ID"); csec=os.getenv("BLOGGER_CLIENT_SECRET"); rtok=os.getenv("BLOGGER_REFRESH_TOKEN"); bid=os.getenv("BLOGGER_BLOG_ID")
            tr=requests.post("https://oauth2.googleapis.com/token", data={"client_id":cid,"client_secret":csec,"refresh_token":rtok,"grant_type":"refresh_token"}, timeout=20)
            if tr.status_code==200:
              at=tr.json()["access_token"]
              pr=requests.post(f"https://www.googleapis.com/blogger/v3/blogs/{bid}/posts/", headers={"Authorization":f"Bearer {at}","Content-Type":"application/json"}, json={"title":f"{title} - {marker} LOCKED Via Carlo Felice","content":html,"labels":[marker,topic_id]}, timeout=25)
              print(f"BLOGGER {pr.status_code}")
          except Exception as e:
            print(f"Blogger {e}")

          # Telegram
          try:
            bot=os.getenv("TELEGRAM_BOT_TOKEN"); chat=os.getenv("TELEGRAM_CHAT_ID")
            requests.post(f"https://api.telegram.org/bot{bot}/sendMessage", data={"chat_id":chat,"text":f"{title}\n{link1}\nMarker {marker} - Via Carlo Felice"}, timeout=15)
            print("TELEGRAM OK")
          except Exception as e:
            print(f"Telegram {e}")

          # Save today as posted
          posted[today]=topic_id
          # Keep only last 30 days
          posted = dict(list(posted.items())[-30:])
          json.dump(posted, open(posted_file,"w"), indent=2)
          open(f"posts/{topic_id}.html","w",encoding="utf-8").write(html)
          open("posts/index.html","w",encoding="utf-8").write(f"<html><body><h1>{marker} LOCKED {topic_id}</h1><img src='{img1}'><img src='{img2}'><a href='{link1}'>{link1}</a></body></html>")
          open("posts/sitemap.xml","w").write(f'<?xml version="1.0"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/{topic_id}.html</loc><lastmod>{today}</lastmod></url></urlset>')
          print("DONE - 1 per day LOCKED")
          PY

      - name: Build Public
        run: |
          mkdir -p public; cp posts/index.html public/index.html; cp public/index.html public/404.html; find posts -name "*.html" -exec cp {} public/ \; 2>/dev/null || true; cp posts/sitemap.xml public/ 2>/dev/null || true; cp posts/posted.json public/ 2>/dev/null || echo "{}" > public/posted.json; echo '{"name":"TRTT 787950"}' > public/manifest.json; echo "User-agent: *\nAllow: /\nSitemap: https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/sitemap.xml" > public/robots.txt; ls -lh public/

      - name: Deploy gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
