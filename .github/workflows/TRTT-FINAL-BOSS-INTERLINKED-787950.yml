f="https://www.airhelp.com/?marker={marker}&sub_id=CLAIM_787950" target="_blank">Claim 600€ - {marker}</a></div><img src="{img2}"><div class="card"><h3>🏠 6. Hub + 🎒 Backpack - Amazon Direct</h3><a class="btn blue" href="{amazon_direct}" target="_blank">🎒 Buy Backpack Amazon Direct - {marker}</a><a class="btn dark" href="{blog_main}" target="_blank" style="margin-top:10px">🏠 Visit Blog Hub - {marker}</a></div><p style="text-align:center;font-size:11px;color:#888;margin-top:15px">Marker {marker} Locked - Direct No White - No tpo.lv - PWA Ready - Via Carlo Felice Sanluri - 2026-10-26<br/>GitHub Pages Branch: gh-pages / root</p><script>if('serviceWorker' in navigator){{navigator.serviceWorker.register('sw.js')}}</script></body></html>"""
