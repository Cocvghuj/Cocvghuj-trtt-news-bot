name: SHOP 787950 FINAL ALL TOKENS DUPLICATE FIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FIX - Create posts/index.html if missing with all Ripu Tokens
        run: |
          mkdir -p posts
          if [ ! -f posts/index.html ]; then
          echo "posts/index.html NOT FOUND - Creating new with all 787950 tokens"
          cat > posts/index.html << 'HTML'
          <!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Sanluri Shop - Via Carlo Felice - 787950 LOCKED</title><style>body{font-family:sans-serif;margin:0;background:#f5f5f5}.header{background:linear-gradient(90deg,#00b4d8,#00f260);color:#fff;padding:20px;text-align:center}.card{background:#fff;margin:12px;border-radius:12px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,.1);border-left:5px solid #00b4d8}.btn{display:block;text-align:center;padding:14px;border-radius:10px;color:#fff;text-decoration:none;font-weight:bold;margin-top:10px}</style></head><body><div class="header"><h2>🇮🇹 My Shop - Via Carlo Felice, Sanluri - Ripu</h2><p>6 Shops - Marker 787950 LOCKED - DIRECT - PWA - All Tokens</p><p style="background:#fff;color:#000;display:inline-block;padding:5px 12px;border-radius:20px">📍 Via Carlo Felice 12, Sanluri - Open 09:00-20:00</p></div><img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62" style="width:94%;margin:12px;border-radius:12px"><div class="card"><b>1. Flight 19€ Aviasales</b><a class="btn" style="background:#00c853" href="https://aviasales.tp.st/7d6yQZ2R?marker=787950&trs=123">Book 19€ Flight - 787950</a></div><div class="card"><b>2. eSIM 5€ Airalo</b><a class="btn" style="background:#ff6d00" href="https://airalo.tp.st/xxxx?marker=787950">Get 5€ eSIM - 787950</a></div><div class="card"><b>3. Hotel 50€ Klook</b><a class="btn" style="background:#7c4dff" href="https://klook.tp.st/xxxx?marker=787950">Book 50€ Hotel - 787950</a></div><div class="card"><b>4. Bus 5€ ARST</b><a class="btn" style="background:#0091ff" href="https://www.arst.sardegna.it/?marker=787950">Bus Guide - Via Carlo Felice 787950</a></div><div class="card"><b>5. Claim 600€ Airhelp</b><a class="btn" style="background:#d50000" href="https://airhelp.tp.st/xxxx?marker=787950">Claim 600€ - 787950</a></div><div class="card"><b>6. Backpack Amazon</b><a class="btn" style="background:#ffab00;color:#000" href="https://www.amazon.com/dp/B0XXXX?tag=787950-20">Buy Backpack - 787950</a></div><p style="text-align:center;color:#666;padding:20px">Direct - No tpo.lv - Duplicate Check - 787950 LOCKED - Ripu All Tokens</p></body></html>
          HTML
          fi
          ls -lh posts/
          grep -c "787950" posts/index.html
          echo "Tokens found - OK"

      - name: Duplicate Check Ripu
        run: |
          python3 << 'PY'
          import os, json, hashlib
          f="posts/posted.json"
          idx="posts/index.html"
          posted=[]
          if os.path.exists(f):
            try: posted=json.load(open(f))
            except: posted=[]
          h=hashlib.md5(open(idx,'rb').read()).hexdigest() if os.path.exists(idx) else ""
          print(f"Hash: {h}, Posted count: {len(posted)}")
          if h in posted:
            print("DUPLICATE - Same content")
            open("DUPLICATE.txt","w").write("duplicate")
          else:
            print("NEW CONTENT - All tokens OK")
            if h:
              posted.append(h)
              posted=posted[-100:]
              json.dump(posted, open(f,"w"))
            open("DUPLICATE.txt","w").write("new")
          PY

      - name: Deploy Shop with All Tokens
        run: |
          mkdir -p public
          cp posts/index.html public/index.html
          cp posts/index.html public/404.html
          echo '{"name":"My Shop 787950 Ripu All Tokens","short_name":"Shop 787950"}' > public/manifest.json
          cp posts/posted.json public/posted.json 2>/dev/null || echo "[]" > public/posted.json
          echo "Final Check Tokens:"
          grep -o "787950" public/index.html | wc -l
          ls -lh public/

      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
