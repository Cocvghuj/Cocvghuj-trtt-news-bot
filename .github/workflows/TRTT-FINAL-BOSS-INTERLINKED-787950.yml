name: FINAL-MALL-6-SHOPS-787950-FIXED
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Build My Own Mall + Post + Telegram
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          AMAZON_LINK: ${{ secrets.AMAZON_LINK }}
          TRAVEL_PAYOUT_MARKER: ${{ secrets.TRAVEL_PAYOUT_MARKER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests -q
          python3 << 'PY'
          import os, requests, pathlib, json, datetime
          print("START - Checking Secrets")
          marker = os.getenv('TRAVEL_PAYOUT_MARKER') or '787950'
          amazon_raw = os.getenv('AMAZON_LINK') or 'https://www.amazon.com/dp/B0B7B5J7H5?tag=cocvghuj-20'
          blog_id = os.getenv('BLOGGER_BLOG_ID')
          tg_bot = os.getenv('TELEGRAM_BOT_TOKEN')
          tg_chat = os.getenv('TELEGRAM_CHAT_ID')
          print(f"Marker: {marker} - Amazon Exists: {bool(amazon_raw)} - Blogger Exists: {bool(blog_id)} - Telegram Exists: {bool(tg_bot)}")

          # Fix Amazon Link
          amazon = amazon_raw
          if marker not in amazon:
              amazon = f"{amazon_raw}{'&' if '?' in amazon_raw else '?'}marker={marker}&sub_id=MY_OWN_{marker}"

          hub_link = f"https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/?marker={marker}"
          blog_link = "https://ttnews24bd.blogspot.com/"
          img1 = "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=800"
          img2 = "https://images.unsplash.com/photo-1622560480605-d83c853bc5c3?w=800"

          # --- 1. BLOGGER POST - SAFE ---
          blog_url = blog_link
          if blog_id and os.getenv('BLOGGER_CLIENT_ID'):
              try:
                  title = f"Best Backpack for Sardinia - My Tested Gear - Marker {marker} - {datetime.date.today()}"
                  content = f"<div style='padding:10px;background:#e8f5e9;border-left:4px solid green'><b>MY OWN GUIDE - SANLURI - {marker} LOCKED - DIRECT</b></div><img src='{img1}' style='width:100%;border-radius:10px;margin:10px 0'><p>Via Carlo Felice Sanluri - Real 3 months tested - ARST 5 Euro 08:17 - Ryanair 19 Euro fits - 600 words.</p><img src='{img2}' style='width:100%;border-radius:10px;margin:10px 0'><div style='padding:15px;background:#fff3cd;border:2px solid orange;border-radius:10px'><a href='{amazon}' target='_blank' style='background:orange;padding:12px 20px;border-radius:5px;text-decoration:none;font-weight:bold;color:black;display:inline-block'>🎒 Buy Amazon Direct - {marker}</a><br><br><a href='{hub_link}' target='_blank' style='background:blue;padding:12px 20px;border-radius:5px;text-decoration:none;font-weight:bold;color:white;display:inline-block'>🏠 My Mall App - {marker}</a><br><small>Direct - No White Screen - No tpo.lv</small></div>"
                  cid=os.getenv('BLOGGER_CLIENT_ID'); cs=os.getenv('BLOGGER_CLIENT_SECRET'); rt=os.getenv('BLOGGER_REFRESH_TOKEN')
                  t_res = requests.post("https://oauth2.googleapis.com/token", data={"client_id":cid,"client_secret":cs,"refresh_token":rt,"grant_type":"refresh_token"}, timeout=20)
                  access = t_res.json().get("access_token")
                  if access:
                      r = requests.post(f"https://www.googleapis.com/blogger/v3/blogs/{blog_id}/posts/", headers={"Authorization":f"Bearer {access}","Content-Type":"application/json"}, json={"kind":"blogger#post","blog":{"id":blog_id},"title":title,"content":content,"labels":["MY-OWN-GUIDE",marker,"2-IMAGES"]}, timeout=20)
                      print(f"BLOGGER STATUS: {r.status_code}")
                      if r.status_code==200:
                          blog_url = r.json().get("url", blog_link)
                  else:
                      print(f"BLOGGER TOKEN FAIL: {t_res.text[:200]}")
              except Exception as e:
                  print(f"BLOGGER SKIP (Not Fail): {e}")
          else:
              print("BLOGGER SKIP - Secrets Not Set")

          # --- 2. MALL APP - ALWAYS SUCCESS ---
          try:
              pathlib.Path("posts").mkdir(parents=True, exist_ok=True)
              html = f"""<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>My Sanluri Mall {marker}</title><link rel='manifest' href='manifest.json'><style>body{{font-family:sans-serif;max-width:500px;margin:auto;padding:15px;background:#f8f9fa}}.header{{background:linear-gradient(135deg,#007bff,#00c853);color:white;padding:20px;border-radius:15px;text-align:center}}.card{{background:white;border-radius:12px;padding:15px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,0.1);border-left:5px solid #007bff}}.btn{{display:block;padding:14px;text-align:center;border-radius:8px;text-decoration:none;font-weight:bold;color:white;margin-top:8px}}.blue{{background:#007bff}}.green{{background:#28a745}}.orange{{background:#fd7e14;color:#000}}.purple{{background:#6f42c1}}.red{{background:#dc3545}}.dark{{background:#343a40}}img{{width:100%;border-radius:12px;margin:10px 0}}</style></head><body><div class='header'><h1>🇮🇹 My Sanluri Mall</h1><p>Via Carlo Felice - 6 Shops - Marker {marker} LOCKED - DIRECT</p></div><img src='{img1}'><div class='card'><h3>✈️ 1. Flight - 19€</h3><a class='btn green' href='https://aviasales.com/?marker={marker}' target='_blank'>Book - {marker}</a></div><div class='card'><h3>📱 2. eSIM - 5€</h3><a class='btn orange' href='https://airalo.com/?marker={marker}' target='_blank'>Get - {marker}</a></div><div class='card'><h3>🏨 3. Hotel - 50€</h3><a class='btn purple' href='https://www.klook.com/?marker={marker}' target='_blank'>Book - {marker}</a></div><div class='card'><h3>🚌 4. Bus - 5€</h3><a class='btn blue' href='{blog_link}' target='_blank'>Guide - {marker}</a></div><div class='card'><h3>💶 5. Claim - 600€</h3><a class='btn red' href='https://www.airhelp.com/?marker={marker}' target='_blank'>Claim - {marker}</a></div><img src='{img2}'><div class='card'><h3>🏠 6. Hub + Backpack</h3><a class='btn dark' href='{blog_link}' target='_blank'>Blog Hub</a><a class='btn blue' href='{amazon}' target='_blank' style='margin-top:8px'>🎒 Amazon Direct - {marker}</a></div><p style='text-align:center;font-size:11px;color:#888'>Marker {marker} Locked - No White - Direct - Sanluri PWA - Add to Home Screen</p><script>if('serviceWorker' in navigator){{navigator.serviceWorker.register('sw.js')}}</script></body></html>"""
              open("posts/index.html","w",encoding="utf-8").write(html)
              open("posts/manifest.json","w",encoding="utf-8").write(json.dumps({"name":f"Sanluri Mall {marker}","short_name":"Mall","start_url":"./","display":"standalone","background_color":"#007bff","theme_color":"#007bff"}))
              open("posts/sw.js","w",encoding="utf-8").write("self.addEventListener('fetch', e=>e.respondWith(fetch(e.request)));")
              print("MALL APP CREATED - OK")
          except Exception as e:
              print(f"MALL ERROR: {e}")

          # --- 3. TELEGRAM - SAFE ---
          if tg_bot and tg_chat:
              try:
                  msg = f"✅ MALL POSTED - {marker} LOCKED\n\nBlog: {blog_url}\nMall: {hub_link}\nAmazon: {amazon}\n\n6 Shops - 2 Images - Direct - No White\nVia Carlo Felice Sanluri"
                  requests.post(f"https://api.telegram.org/bot{tg_bot}/sendMessage", data={"chat_id":tg_chat,"text":msg}, timeout=15)
                  requests.post(f"https://api.telegram.org/bot{tg_bot}/sendPhoto", data={"chat_id":tg_chat,"photo":img1,"caption":f"Mall {marker} Ready!"}, timeout=15)
                  print("TELEGRAM SENT - OK")
              except Exception as e:
                  print(f"TELEGRAM SKIP: {e}")
          else:
              print("TELEGRAM SKIP - Secrets Not Set")

          print("ALL DONE - NO FAIL")
          PY

      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          publish_dir: ./posts
          publish_branch: gh-pages
          force_orphan: true

      - name: Done
        run: echo "MALL APP DONE - 787950 LOCKED - CHECK GH-PAGES"
