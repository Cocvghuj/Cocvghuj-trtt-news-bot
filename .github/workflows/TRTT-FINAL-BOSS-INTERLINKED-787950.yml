name: SHOP 787950 FINAL ALL TOKENS DUPLICATE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Duplicate Check Ripu Tokens
        run: |
          mkdir -p posts
          python3 << 'PY'
          import os, json, hashlib
          f = "posts/posted.json"
          idx = "posts/index.html"
          posted = []
          if os.path.exists(f):
            try:
              posted=json.load(open(f))
            except:
              posted=[]
          h=""
          if os.path.exists(idx):
            h=hashlib.md5(open(idx,'rb').read()).hexdigest()
          print(f"Ripu Token Check: 787950 in file? { '787950' in open(idx).read() if os.path.exists(idx) else False }")
          print(f"Hash: {h}")
          print(f"Posted: {len(posted)}")
          if h in posted:
            print("DUPLICATE - Skip")
            open("DUPLICATE.txt","w").write("duplicate")
          else:
            print("NEW - Deploy with all tokens")
            if h:
              posted.append(h)
              posted=posted[-100:]
              json.dump(posted, open(f,"w"))
            open("DUPLICATE.txt","w").write("new")
          PY

      - name: Deploy Index with All Ripu Tokens
        run: |
          mkdir -p public
          cp posts/index.html public/index.html
          cp posts/index.html public/404.html
          echo '{"name":"My Shop 787950 Ripu All Tokens","short_name":"Shop 787950"}' > public/manifest.json
          echo "--- Checking Tokens in Deployed File ---"
          grep -o "787950" public/index.html | wc -l
          echo "Should be 12+ tokens"
          ls -lh public/

      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Ripu All Tokens 787950 Shop Deploy'
