name: Push Branch with GH_PAT
on: workflow_dispatch

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with GH_PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          
      - name: Push copilot branch
        run: |
          git config user.name "Cocvghuj"
          git config user.email "Cocvghuj@github.com"
          git checkout -B copilot/english-news-drafts-hardening
          git add -A
          git commit -m "feat: english news drafts hardening million dollar" || echo "nothing to commit"
          git push -f origin copilot/english-news-drafts-hardening
