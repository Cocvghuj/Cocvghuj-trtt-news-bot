on:
  schedule:
    - cron: '0 7,13,19 * * *'  # দিনে 3 টা - Italy 9AM, 3PM, 9PM
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: BUILD TRAFFIC NEWS
        run: |
          MARKER="787950"
          DATE=$(date +"%Y-%m-%d")
          TIME=$(date +"%H:%M")
          CITY="Cagliari"
          
          mkdir -p news
          NEXT=$(ls news/*.html 2>/dev/null | wc -l)
          NEXT=$((NEXT+1))
          FILE="news/${DATE}-$NEXT.html"
          
          # 1. REAL ITALIAN CONTENT - 300 words - Google E-E-A-T - No Spam
          cat > $FILE << EOF
          <!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
