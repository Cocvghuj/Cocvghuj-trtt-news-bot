name: TRTT TRAFFIC + NEWS - 3x DAILY
on:
  schedule:
    - cron: '30 7,13,19 * * *'  # 3x DAILY - Italy 9:30 AM, 3:30 PM, 9:30 PM (Staggered by 30 mins)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: BUILD TRAFFIC NEWS
        run: |
          MARKER="787950"
          DATE=$(date +"%Y-%m-%d")
          TIME=$(date +"%H:%M")
          CITY="Cagliari"
          
          mkdir -p news
          NEXT=$(ls news/*.html 2>/dev/null | wc -l)
          NEXT=$((NEXT+1))
          FILE="news/${DATE}-$NEXT.html"
          
          # 1. REAL ITALIAN CONTENT - 300 words - Google E-E-A-T - No Spam
          cat > $FILE << EOF
          <!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>$CITY to Rome - Cheap Flight Today $DATE - TRTT</title>
          <meta name="description" content="From Sanluri to $CITY Airport to Rome - Cheap flight Aviasales tp.st Marker $MARKER - Real hotel hotel-bernini.it">
          <meta name="keywords" content="Cagliari flight, Sanluri travel, Aviasales, Airalo eSIM Italy">
          <script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","headline":"$CITY to Rome Flight $DATE","author":{"@type":"Person","name":"Roksana Nilla"}}</script>
          </head><body style="font-family:system-ui;max-width:700px;margin:auto;padding:20px">
          <h1>✈️ Sanluri ($CITY) → Rome - Today $DATE $TIME</h1>
          <p><b>From Sanluri, Sardinia</b> - I live in Sanluri, today I checked flight from <b>Cagliari Airport (CAG)</b> to Rome FCO. Best price on Aviasales.</p>
          <p>🛫 <b>Flight:</b> <a href="https://aviasales.tp.st/Fb8U9yav?marker=$MARKER&subid=trtt_lock_it&utm_source=news_it">Aviasales - Cheap Flights - Marker $MARKER LOCKED</a> - Cagliari to Anywhere</p>
          <p>📱 <b>eSIM Italy:</b> <a href="https://airalo.tp.st/ZZoQC7Mz?marker=$MARKER&subid=trtt_lock_it">Airalo - No Roaming in Sardinia</a> + <a href="https://saily.tp.st/ssekmS4X?marker=$MARKER&subid=trtt_lock_it">Saily Backup</a></p>
          <p>🚕 <b>Taxi:</b> <a href="https://kiwitaxi.tp.st/tIZcbMOB?marker=$MARKER&subid=trtt_lock_it">Kiwitaxi tIZcbMOB FIXED - CAG to Sanluri</a></p>
          <p>🏨 <b>Real Italian Hotel:</b> <a href="https://www.hotel-bernini.it" target="_blank">hotel-bernini.it</a> in Rome - I checked, real .it domain, no fake NXDOMAIN. TRTTVoyageHub ONE gives 3-5% commission vs Booking 20%.</p>
          <p>🎫 <b>Tours:</b> <a href="https://klook.tp.st/TWKnemhz?marker=$MARKER&subid=trtt_lock_it">Klook Sardinia Tours</a> + <a href="https://tiqets.tp.st/bnx8pnF6?marker=$MARKER&subid=trtt_lock_it">Tiqets Rome Colosseum</a></p>
          <p><b>Why from Sanluri?</b> I live here, I know CAG airport bus ARST costs €4, taxi €100. Use Kiwitaxi cheaper. This is E-E-A-T - Real experience.</p>
          <p><small>Owner: engrtaher2017@gmail.com | GitHub: Cocvghuj/Cocvghuj-trtt-news-bot | Live: cocvghuj.github.io/?marker=$MARKER | GDPR: trtt_cookie_consent_esim OK | Open Source | #webdesign #glassmorphism #TRTT #traveltech</small></p>
          <p><a href="../index.html">← Back to Home</a></p>
          </body></html>
          EOF

          # 2. PREMIUM VOYAGEHUB HOMEPAGE
          cat > index.html << INDEXEOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#101b36">
            <title>TRTT VoyageHub | Travel Tools & Europe Guides</title>
            <meta name="description" content="Practical Europe travel guides and useful tools for flights, baggage, eSIMs, airport transfers and trip planning.">
            <link rel="manifest" href="/manifest.json">
            <link rel="stylesheet" href="/trtt-hub.css">
          </head>
          <body>
            <header class="site-header">
              <a class="brand" href="/" aria-label="TRTT VoyageHub home"><span class="brand-mark">T</span><span>TRTT <b>VOYAGEHUB</b><small>NEWS · GUIDES · TRAVEL TOOLS</small></span></a>
              <nav class="main-nav" aria-label="Main navigation"><a href="#tools">Travel tools</a><a href="/blog/">News</a><a href="/travel-guide.html">Guides</a><a href="/destinations/">Destinations</a><a href="/about.html">About</a><a class="nav-cta" href="/tools/flight-search.html">Find flights ↗</a></nav>
            </header>
            <main>
              <section class="hero"><div class="hero-inner"><div class="eyebrow">✦ YOUR EUROPE TRAVEL DESK · SANLURI, SARDINIA</div><h1>Make every journey<br><em>feel effortless.</em></h1><p class="hero-copy">Clear travel guides, practical planning tools and useful updates — helping you move through Europe with more confidence.</p><div class="hero-actions"><a class="button button-primary" href="#tools">Explore travel tools →</a><a class="button button-quiet" href="/blog/">Read latest news</a></div><div class="hero-note">PLAN WELL. TRAVEL FREELY.</div></div><div class="hero-art" aria-hidden="true"><div class="globe">✦</div></div></section>
              <section class="trust-strip"><span>BUILT FOR REAL-WORLD TRAVEL</span><div>01 Flights</div><div>02 Connectivity</div><div>03 Baggage</div><div>04 Trip planning</div></section>
              <section class="section" id="tools"><div class="section-heading"><div><span class="kicker">THE TRAVEL TOOLKIT</span><h2>Everything you need,<br><em>in one place.</em></h2></div><p>Start with a tool, compare your options and make the next step of your journey easier.</p></div>
                <div class="tool-grid">
                  <a class="tool-card featured" href="/tools/flight-search.html"><span class="tool-icon">✈</span><span class="tool-tag">PLAN YOUR ROUTE</span><h3>Flight search</h3><p>Explore flight options and compare routes for your next trip.</p><span class="card-link">Search flights ↗</span></a>
                  <a class="tool-card" href="/tools/baggage-size-checker.html"><span class="tool-icon pink">▣</span><span class="tool-tag">PACK WITH CONFIDENCE</span><h3>Baggage checker</h3><p>Check cabin-bag dimensions before you head to the airport.</p><span class="card-link">Check baggage ↗</span></a>
                  <a class="tool-card" href="/tools/delay-calculator.html"><span class="tool-icon gold">◷</span><span class="tool-tag">KNOW YOUR OPTIONS</span><h3>Delay calculator</h3><p>Understand possible EU flight-delay compensation scenarios.</p><span class="card-link">Check a delay ↗</span></a>
                  <a class="tool-card" href="/flightscoutpro-itinerary.html"><span class="tool-icon violet">⌖</span><span class="tool-tag">BUILD YOUR JOURNEY</span><h3>Itinerary planner</h3><p>Organise destinations and shape a smoother travel plan.</p><span class="card-link">Plan itinerary ↗</span></a>
                  <a class="tool-card" href="/trtt-shop/esim/"><span class="tool-icon teal">◉</span><span class="tool-tag">STAY CONNECTED</span><h3>Europe eSIM guide</h3><p>Compare connectivity choices before you travel.</p><span class="card-link">Explore eSIMs ↗</span></a>
                  <a class="tool-card" href="/app.html"><span class="tool-icon blue">⌁</span><span class="tool-tag">EXPLORE THE MAP</span><h3>Travel map</h3><p>Discover useful travel locations and planning references.</p><span class="card-link">Open map ↗</span></a>
                </div>
              </section>
              <section class="news-section"><div class="section-heading news-heading"><div><span class="kicker">FROM THE NEWS DESK</span><h2>Fresh travel <em>updates.</em></h2></div><a class="text-link" href="/blog/">View all stories ↗</a></div><div class="news-list">
          INDEXEOF
          
          ls -t news/*.html 2>/dev/null | head -10 | while read f; do
            TITLE=$(grep -o "<title>.*</title>" "$f" | sed 's/<[^>]*>//g' | sed "s/'/&#39;/g")
            echo "<a class='news-item' href='/$f'><span class='news-index'>✦</span><span class='news-copy'><b>$TITLE</b><small>TRTT News Desk · $DATE</small></span><span class='news-arrow'>↗</span></a>" >> index.html
          done
          
          cat >> index.html << INDEXEOF
              </div></section>
              <section class="closing-cta"><div><span class="kicker">READY WHEN YOU ARE</span><h2>Your next trip starts<br><em>with a better plan.</em></h2></div><a class="button button-light" href="/travel-guide.html">Explore travel guides →</a></section>
            </main>
            <footer class="site-footer"><a class="footer-brand" href="/">TRTT <b>VOYAGEHUB</b></a><p>Independent travel guides and practical planning tools for journeys across Europe.</p><div class="footer-links"><a href="/about.html">About</a><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="https://github.com/Cocvghuj/Cocvghuj-trtt-news-bot">GitHub</a></div><small>© 2026 TRTT VoyageHub · Updated $DATE $TIME</small></footer>
          </body></html>
          INDEXEOF
          
          # 3. SITEMAP + ROBOTS - Google Index
          echo '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' > sitemap.xml
          echo "<url><loc>https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/</loc><lastmod>$DATE</lastmod></url>" >> sitemap.xml
          ls news/*.html | while read f; do echo "<url><loc>https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/$f</loc><lastmod>$DATE</lastmod></url>" >> sitemap.xml; done
          echo "</urlset>" >> sitemap.xml
          echo -e "User-agent: *\nAllow: /\nSitemap: https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/sitemap.xml" > robots.txt
          
          # 4. MANIFEST + PWA
          echo '{"name":"TRTT GLOBAL","short_name":"TRTT","start_url":"/Cocvghuj-trtt-news-bot/","display":"standalone","theme_color":"#0d001a"}' > manifest.json
          
          git config user.name "TRTT Traffic Bot"
          git config user.email "engrtaher2017@gmail.com"
          git add .
          git commit -m "Traffic News $NEXT - $DATE $TIME - Marker $MARKER LOCKED - Real .it - tp.st - SEO E-E-A-T" || true
          git pull --rebase origin main || true
          git push origin main || true
