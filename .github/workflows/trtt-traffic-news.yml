          <div class="glass"><h2>📰 Latest News - $DATE - $TIME - Traffic Ready</h2>
          INDEXEOF
          
          ls -t news/*.html | head -10 | while read f; do
            TITLE=$(grep -o "<title>.*</title>" $f | sed 's/<[^>]*>//g')
            echo "<p>📍 <a href='$f'>$TITLE</a> - $DATE</p>" >> index.html
          done
          
          echo "</div><div class='glass'><p>Live Bot: cocvghuj.github.io/?marker=$MARKER | PWA App: app.html | Sitemap: sitemap.xml | #traveltech #lumina #glassmorphism</p></div></body></html>" >> index.html

          # 3. SITEMAP + ROBOTS - Google Index
          echo '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' > sitemap.xml
          echo "<url><loc>https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/</loc><lastmod>$DATE</lastmod></url>" >> sitemap.xml
          ls news/*.html | while read f; do echo "<url><loc>https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/$f</loc><lastmod>$DATE</lastmod></url>" >> sitemap.xml; done
          echo "</urlset>" >> sitemap.xml
          echo -e "User-agent: *\nAllow: /\nSitemap: https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/sitemap.xml" > robots.txt
          
          # 4. MANIFEST + PWA
          echo '{"name":"TRTT GLOBAL","short_name":"TRTT","start_url":"/Cocvghuj-trtt-news-bot/","display":"standalone","theme_color":"#0d001a"}' > manifest.json
          
          git config user.name "TRTT Traffic Bot"
          git config user.email "engrtaher2017@gmail.com"
          git add .
          git commit -m "Traffic News $NEXT - $DATE $TIME - Marker $MARKER LOCKED - Real .it - tp.st - SEO E-E-A-T" || true
          git push || true
