name: TRTT Final Neon Sync OS - 50 Blogs 500 Commands
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  neon-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with: { fetch-depth: 0 }

      - name: BUILD FINAL NEON SYNC OS WITH YOUR INDEX.HTML
        env:
          MARKER_ID: ${{ secrets.TRAVEL_PAYOUT_MARKER }}
          GMAIL_ID: ${{ secrets.GMAIL_EMAIL }}
          BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          AMAZON_URL: ${{ secrets.AMAZON_LINK }}
        run: |
          MARKER="${MARKER_ID:-787950}"
          GMAIL="${GMAIL_ID:-engrtaher2017@gmail.com}"
          BLOG_ID="${BLOG_ID:-Trttnews24bd}"
          AMAZON="${AMAZON_URL:-https://amzn.to/4shg6Hn}"
          DATE=$(date +%Y-%m-%d)
          echo "=== FINAL NEON SYNC OS - MARKER $MARKER - 50 BLOGS 500 COMMANDS ==="
          mkdir -p exact-50-blogs travel-guides

          # 1. Build Exactly 50 Blogs = 500 Commands
          for b in $(seq 1 50); do
            mkdir -p exact-50-blogs/blog-$b
            echo "<!DOCTYPE html><html><head><meta charset=UTF-8><title>Blog $b - Marker $MARKER</title></head><body><h1>TRTT Blog $b - Marker $MARKER</h1><p>Owner $GMAIL | Blog ID $BLOG_ID</p><p><a href=https://aviasales.tpo.lv/Fb8U9yav?marker=$MARKER&subid=blog_$b>Flight Blog $b</a> | <a href=$AMAZON>Amazon</a></p></body></html>" > exact-50-blogs/blog-$b/index.html
          done

          # 2. Manifest - Neon #00f2fe - Your given JSON
          cat > manifest.json << 'EOF'
          {
            "name": "TRTT Global Empire",
            "short_name": "TRTT",
            "start_url": "/Cocvghuj-trtt-news-bot/index.html",
            "scope": "/Cocvghuj-trtt-news-bot/",
            "display": "standalone",
            "background_color": "#020617",
            "theme_color": "#00f2fe",
            "description": "TRTT Global Empire - Marker 787950 - 50 Blogs 500 Commands - Trttnews24bd",
            "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/854/854878.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]
          }
          EOF

          # 3. robots + sitemap + partners
          echo "User-agent: *\nAllow: /\nSitemap: https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/sitemap.xml" > robots.txt
          echo '<?xml version="1.0"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/</loc></url><url><loc>https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/app.html</loc></url></urlset>' > sitemap.xml
          cat > partners.json << EOF
          {"owner":"$GMAIL","marker":"$MARKER","blog_id":"$BLOG_ID","total_blogs":50,"total_commands":500,"nodes":[{"city":"Rome","lat":41.8003,"lng":12.2389,"link":"https://aviasales.tpo.lv/Fb8U9yav?marker=$MARKER"},{"city":"Dhaka","lat":23.8103,"lng":90.4125,"link":"https://airalo.tpo.lv/ZZoQC7Mz?marker=$MARKER"}]}
          EOF
          echo "self.addEventListener('fetch',e=>e.respondWith(fetch(e.request)))" > sw.js

          # 4. ===== YOUR GIVEN INDEX.HTML - NEON SYNC OS - WITH MARKER INJECTION ======
          cat > index.html << EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>TRTT Global Ecosystem | Blog & GitHub Sync OS - Marker $MARKER</title>
          <link rel="manifest" href="manifest.json">
          <meta name="theme-color" content="#00f2fe">
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
          <style>
          :root{--neon:#00f2fe;--blue:#0072ff;--gold:#facc15;--bg:#020617;--card:rgba(15, 23, 42, 0.9);--border:rgba(56, 189, 248, 0.3)}
          *{margin:0;padding:0;box-sizing:border-box}
          body{background:var(--bg);color:#f8fafc;font-family:system-ui,-apple-system,sans-serif}
          .navbar{position:sticky;top:0;background:rgba(2,6,23,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 5%;display:flex;justify-content:space-between;align-items:center;z-index:1000}
          .logo{font-size:20px;font-weight:900;color:#fff;text-decoration:none;display:flex;align-items:center;gap:8px}
          .logo span{background:linear-gradient(90deg,var(--neon),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
          .container{max-width:1100px;margin:40px auto;padding:0 20px}
          .sync-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:30px;box-shadow:0 0 40px rgba(0,242,254,0.15);text-align:center;margin-bottom:30px}
          .sync-box h1{font-size:28px;margin-bottom:10px;color:#fff}
          .sync-box h1 span{background:linear-gradient(90deg,var(--neon),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
          .sync-box p{color:#94a3b8;font-size:14px;margin-bottom:20px}
          .btn-sync{background:linear-gradient(90deg,var(--neon),var(--blue));color:#020617;border:none;padding:12px 28px;border-radius:10px;font-weight:900;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block;transition:.3s}
          .btn-sync:hover{box-shadow:0 0 25px rgba(0,242,254,0.5);transform:translateY(-2px)}
          .feed-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
          .feed-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;transition:.3s}
          .feed-card:hover{border-color:var(--neon);transform:translateY(-3px)}
          .feed-card h3{font-size:16px;margin-bottom:8px;color:#fff}
          .feed-card p{font-size:13px;color:#94a3b8;line-height:1.6}
          footer{background:#010409;border-top:1px solid var(--border);padding:30px 5%;text-align:center;color:#94a3b8;font-size:12px;margin-top:50px}
          </style>
          </head>
          <body>
          <nav class="navbar">
          <a href="#" class="logo"><i class="fa-solid fa-globe" style="color:var(--neon)"></i> TRTT <span>Global Sync OS</span></a>
          <div style="background:rgba(250,204,21,0.1);color:var(--gold);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:bold;border:1px solid rgba(250,204,21,0.3)">Marker: $MARKER</div>
          </nav>
          <div class="container">
          <div class="sync-box">
          <h1>Trttnews24bd & GitHub <span>Autonomous Sync Hub</span></h1>
          <p>Bridging your official blog ecosystem with GitHub Pages and PWA architecture for maximum global reach. Owner: $GMAIL | Marker: $MARKER | Blog ID: $BLOG_ID</p>
          <a href="https://github.com/Cocvghuj/Cocvghuj-trtt-news-bot" target="_blank" class="btn-sync"><i class="fa-brands fa-github"></i> Explore GitHub Empire</a>
          <a href="exact-50-blogs/" style="margin-left:10px;background:linear-gradient(90deg,var(--gold),var(--neon));color:#020617;border:none;padding:12px 28px;border-radius:10px;font-weight:900;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block">View 50 Blogs Empire</a>
          </div>
          <h2 style="font-size:20px;margin-bottom:20px;color:#fff"><i class="fa-solid fa-rss" style="color:var(--neon)"></i> Live Blog & Partner Feed Stream - Marker $MARKER - 500 Commands Active</h2>
          <div class="feed-grid" id="liveFeedContainer">
          <div class="feed-card"><h3><i class="fa-solid fa-plane" style="color:var(--neon)"></i> Rome FCO Flight Node - Marker $MARKER</h3><p>Beat Booking.com - FCO to Rome - Affiliate: <a href="https://aviasales.tpo.lv/Fb8U9yav?marker=$MARKER&subid=rome_$DATE" target="_blank" style="color:var(--neon)">Book Now - Marker $MARKER</a> - Command 1-100</p></div>
          <div class="feed-card"><h3><i class="fa-solid fa-sim-card" style="color:var(--gold)"></i> Global eSIM Hub - Marker $MARKER</h3><p>Stay connected worldwide - <a href="https://airalo.tpo.lv/ZZoQC7Mz?marker=$MARKER&subid=esim_$DATE" target="_blank" style="color:var(--neon)">Get eSIM - Marker $MARKER</a> - Command 101-200</p></div>
          <div class="feed-card"><h3><i class="fa-solid fa-bag-shopping" style="color:var(--blue)"></i> Amazon Nomad Store - Marker $MARKER</h3><p>Nomad essentials - <a href="$AMAZON?tag=trtt-$MARKER" target="_blank" style="color:var(--neon)">Shop Now - Marker $MARKER</a> - Command 201-300</p></div>
          <div class="feed-card"><h3><i class="fa-solid fa-globe" style="color:var(--neon)"></i> Trttnews24bd Official Integration - Blog ID $BLOG_ID</h3><p>Successfully synchronized with GitHub workflow actions, ensuring zero data loss and lightning-fast global delivery. 50 Blogs Empire - 500 Commands - Owner $GMAIL</p></div>
          <div class="feed-card"><h3><i class="fa-solid fa-chart-line" style="color:var(--gold)"></i> Travelpayouts Marker Engine - Marker $MARKER</h3><p>Active tracking ID $MARKER deployed across flight search nodes, eSIM deployment, and nomad gear stores. Exactly 50 Blogs x 10 Commands = 500 Commands Empire - Monetization Active.</p></div>
          <div class="feed-card"><h3><i class="fa-solid fa-map" style="color:var(--neon)"></i> Interactive Map - Partners with Gmail GitHub Marker</h3><p><a href="app.html" style="color:var(--neon)">Open Map App - Marker $MARKER - $GMAIL - View all partner markers</a> - Command 301-400 - PWA Neon #00f2fe</p></div>
          </div>
          </div>
          <footer><b>© 2026 TRTT Enterprise Ecosystem</b> • Owner: $GMAIL | Marker: $MARKER | Blog ID: $BLOG_ID<br>Connected via GitHub Pages & Trttnews24bd Blog Automation | 50 Blogs Empire | 500 Commands | Neon PWA #00f2fe | Monetization Active - 2 years effort fixed<br><a href="https://github.com/Cocvghuj/Cocvghuj-trtt-news-bot" style="color:var(--neon)">GitHub Empire</a> | <a href="exact-50-blogs/" style="color:var(--gold)">50 Blogs</a> | <a href="app.html" style="color:var(--neon)">Map App</a></footer>
          <script>console.log("TRTT Autonomous Sync Initialized for Trttnews24bd & GitHub. Marker $MARKER, Blog $BLOG_ID, Owner $GMAIL, 50 Blogs 500 Commands, Neon #00f2fe"); if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
          </body>
          </html>
          EOF

          cat > app.html << EOF
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Map - Marker $MARKER</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>#map{height:80vh}body{margin:0;font-family:system-ui;background:#020617;color:#fff}</style></head><body><div style="padding:10px;background:linear-gradient(90deg,#020617,#00f2fe)">TRTT Map - Marker $MARKER - <a href="index.html" style="color:#fff">Back to Sync OS</a></div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>fetch('partners.json').then(r=>r.json()).then(d=>{const m=L.map('map').setView([23.8,90.4],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);d.nodes.forEach(n=>L.marker([n.lat,n.lng]).addTo(m).bindPopup(n.city+'<br>Marker: '+d.marker+'<br><a href='+n.link+' target=_blank>Book - Marker '+d.marker+'</a>'))})</script></body></html>
          EOF

          echo "=== FINAL NEON SYNC OS DONE - YOUR INDEX.HTML INTEGRATED - MARKER $MARKER - 50 BLOGS ==="

      - name: Commit and Push Final Neon Sync OS
        env:
          GMAIL_PUSH: ${{ secrets.GMAIL_EMAIL }}
        run: |
          git config user.name "TRTT-Neon-Sync-Bot"
          if [ -n "$GMAIL_PUSH" ]; then git config user.email "$GMAIL_PUSH"; else git config user.email "engrtaher2017@gmail.com"; fi
          git add .
          git commit -m "FINAL Neon Sync OS - Your Index.html Integrated - Marker 787950 - 50 Blogs 500 Commands - Manifest #00f2fe - Monetization Active [skip ci]" || true
          git push
