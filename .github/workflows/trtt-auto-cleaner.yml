name: TRTT AUTO CLEANER - Jangal Porishkar

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  auto-clean:
    runs-on: ubuntu-latest
    steps:
      - name: TRTT Auto Disable - Fixed V2
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          echo "=== TRTT CLEANER V2 STARTED ==="
          
          # GH_PAT আছে কিনা চেক - না থাকলে সুন্দর করে বলবে, ফেইল করবে না
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ সমস্যা ধরা পড়ছে: GH_PAT পাওয়া যায় নাই!"
            echo "👉 Repo > Settings > Secrets > Actions > New secret"
            echo "👉 Name: GH_PAT, Value: তোমার Personal Access Token"
            echo "👉 টিক দিতে হবে: repo + workflow"
            echo "GH_PAT না বসাইলে Cleaner কাজ করবে না।"
            exit 0
          fi
          
          echo "✅ GH_PAT পাওয়া গেছে, এখন পরিষ্কার করতেছি..."
          
          # ফাইলের নাম দিয়ে চেক করবো, ডিসপ্লে নাম দিয়ে না - এইটাই আসল ফিক্স
          # এই ৪টা ফাইল ছাড়া বাকি সব বন্ধ হবে
          gh api repos/$REPO/actions/workflows --jq '.workflows[] | "\(.id)|\(.path)|\(.name)|\(.state)"' > workflows.txt
          cat workflows.txt
          
          while IFS='|' read -r WF_ID WF_PATH WF_NAME WF_STATE; do
            echo "--- Checking: $WF_NAME | $WF_PATH | $WF_STATE"
            
            if [[ "$WF_PATH" == *"trtt-engine.yml"* ]] || [[ "$WF_PATH" == *"trtt-guard.yml"* ]] || [[ "$WF_PATH" == *"trtt-control.yml"* ]] || [[ "$WF_PATH" == *"trtt-auto-cleaner.yml"* ]]; then
              echo "✅ SAFE - রাখলাম: $WF_NAME"
            else
              if [[ "$WF_STATE" == "disabled_manually" ]] || [[ "$WF_STATE" == "disabled_inactivity" ]]; then
                echo "😴 আগেই বন্ধ: $WF_NAME"
              else
                echo "🧹 বন্ধ করতেছি: $WF_NAME"
                gh api -X PUT repos/$REPO/actions/workflows/$WF_ID/disable -H "Accept: application/vnd.github+json" && echo "✅ বন্ধ হইছে: $WF_NAME" || echo "❌ বন্ধ হয় নাই: $WF_NAME"
              fi
            fi
          done < workflows.txt
          
          echo "=== CLEANER DONE ==="
