name: MULTI-TRILLION 100 Airport Scan

on:
  schedule:
    - cron: '0 4 * * *' # 06:00 Italy = 04:00 UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Scan 100 Airports
        env:
          TRAVEL_MARKER: ${{ secrets.TRAVEL_MARKER }}
        run: |
          python scan_100_airports.py
      - name: Commit Multi-Trillion Data
        run: |
          git config user.name "Multi-Trillion Bot 787950"
          git config user.email "bot@cdn.fdbdx.com"
          git add data/ index.html
          git commit -m "Multi-Trillion Scan 100 Airports - $(date) - Direct No Booking.com - Marker 787950" || echo "No changes"
          git push
