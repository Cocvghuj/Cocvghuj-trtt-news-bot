name: MULTI-TRILLION BACKUP
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      - name: Push to Backup Repo
        run: |
          git config user.name "Cocvghuj"
          git config user.email "Cocvghuj@users.noreply.github.com"
          git remote add backup https://x-access-token:${{ secrets.GH_PAT }}@github.com/Cocvghuj/Cocvghuj-trtt-news-bot-BACKUP-787950.git || true
          git push backup HEAD:main --force
