name: MULTI-TRILLION BACKUP
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Backup Repo
        run: |
          git config user.name "Multi-Trillion Bot 787950"
          git config user.email "bot@multi-trillion.com"
          git remote remove backup 2>/dev/null || true
          git remote add backup https://x-access-token:${{ secrets.GH_PAT }}@github.com/Cocvghuj/Cocvghuj-trtt-news-bot-BACKUP-787950.git
          git push backup main --force
