name: TRTT Daily 4x - 2000 Min Saver - All API Kept

on:
  schedule:
    - cron: '0 4 * * *'   # 6AM Italy
    - cron: '0 10 * * *'  # 12PM Italy
    - cron: '0 16 * * *'  # 6PM Italy
    - cron: '0 20 * * *'  # 10PM Italy
  workflow_dispatch:

jobs:
  trtt-update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run News Bot - All API Kept
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
          DEEP_SEEK_KEY: ${{ secrets.DEEP_SEEK_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          TRAVEL_PAYOUT_MARKER: ${{ secrets.TRAVEL_PAYOUT_MARKER }}
          TRAVEL_PAYOUT_API_TOKEN: ${{ secrets.TRAVEL_PAYOUT_API_TOKEN }}
          AMAZON_LINK: ${{ secrets.AMAZON_LINK }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          CUSTOMER_EMAILS: ${{ secrets.CUSTOMER_EMAILS }}
        run: python generate_travel_news.py

      - name: Commit and Push
        run: |
          git config --global user.name "TRTT Automation Bot"
          git config --global user.email "bot@trttnews24bd.com"
          git add latest_travel_news.html || true
          git add tracker.html sitemap.xml || true
          git commit -m "Auto Update: Travel News [skip ci] - $(date) - Marker 787950 - 2000 Min Saver" || exit 0
          git push
