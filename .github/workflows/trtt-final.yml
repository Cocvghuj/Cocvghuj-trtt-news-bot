name: TRTT ULTIMATE LOCKED - 31 SECRETS FINAL
on:
  schedule:
    - cron: '17 6 * * *'
    - cron: '42 11 * * *'
    - cron: '5 16 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      persona:
        description: 'Manual test'
        required: false
        default: 'neighbor_maria'
        type: choice
        options:
          - neighbor_maria
          - customer_rahim
          - friend_giovanni
          - silent

jobs:
  trtt-ultimate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Decide Persona - Locked
        id: p
        run: |
          H=$(date -u +%H)
          INPUT="${{ github.event.inputs.persona }}"
          echo "Hour $H Input $INPUT"
          if [ -n "$INPUT" ]; then
            echo "persona=$INPUT" >> $GITHUB_OUTPUT
            if [ "$INPUT" = "neighbor_maria" ]; then echo "type=guide" >> $GITHUB_OUTPUT
            elif [ "$INPUT" = "customer_rahim" ]; then echo "type=esim" >> $GITHUB_OUTPUT
            elif [ "$INPUT" = "friend_giovanni" ]; then echo "type=hotel" >> $GITHUB_OUTPUT
            else echo "type=seo" >> $GITHUB_OUTPUT; fi
          else
            if [ "$H" -eq "06" ]; then echo "persona=neighbor_maria" >> $GITHUB_OUTPUT; echo "type=guide" >> $GITHUB_OUTPUT
            elif [ "$H" -eq "11" ]; then echo "persona=customer_rahim" >> $GITHUB_OUTPUT; echo "type=esim" >> $GITHUB_OUTPUT
            elif [ "$H" -eq "16" ]; then echo "persona=friend_giovanni" >> $GITHUB_OUTPUT; echo "type=hotel" >> $GITHUB_OUTPUT
            else echo "persona=silent" >> $GITHUB_OUTPUT; echo "type=seo" >> $GITHUB_OUTPUT; fi
          fi

      - name: Setup Python + Use All 31 Secrets
        if: steps.p.outputs.type != 'seo'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          DEEP_SEEK_KEY: ${{ secrets.DEEP_SEEK_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          TRAVEL_PAYOUT_MARKER: ${{ secrets.TRAVEL_PAYOUT_MARKER }}
          TRAVEL_PAYOUT_API_TOKEN: ${{ secrets.TRAVEL_PAYOUT_API_TOKEN }}
          AMAZON_LINK: ${{ secrets.AMAZON_LINK }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRAVO_API_KEY: ${{ secrets.BRAVO_API_KEY }}
          CONSOLE_API_KEY: ${{ secrets.CONSOLE_API_KEY }}
          EMAIL_OPTIMAS_API_KEY: ${{ secrets.EMAIL_OPTIMAS_API_KEY }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
          ZOHO_API_TOKEN: ${{ secrets.ZOHO_API_TOKEN }}
          ZOHO_CLINT_ID: ${{ secrets.ZOHO_CLINT_ID }}
          ZOHO_CLINT_SECREAT: ${{ secrets.ZOHO_CLINT_SECREAT }}
        run: |
          pip install requests --quiet
          python3 << 'PY'
          import os, requests, json, datetime, random
          persona = os.environ.get('PERSONA', '${{ steps.p.outputs.persona }}')
          ptype = '${{ steps.p.outputs.type }}'
          marker = os.environ.get('TRAVEL_PAYOUT_MARKER','787950')
          # 31 Secrets Load
          GEMINI=os.getenv('GEMINI_API_KEY'); GROQ=os.getenv('GROQ_API_KEY'); OPENAI=os.getenv('OPEN_AI_API_KEY')
          MISTRAL=os.getenv('MISTRAL_API_KEY'); COHERE=os.getenv('COHERE_API_KEY'); DEEPSEEK=os.getenv('DEEP_SEEK_KEY')
          OPENROUTER=os.getenv('OPENROUTER_API_KEY'); HF=os.getenv('HUGGINGFACE_API_KEY')
          UNSPLASH=os.getenv('UNSPLASH_ACCESS_KEY')
          
          print(f"Persona {persona} Type {ptype} Marker {marker}")
          
          # AI Fallback Chain - 8 Providers
          content = None
          prompt = f"Write 400 words evergreen human story as {persona} from Sanluri Sardinia. Topic {ptype}. Real local tips. SEO friendly, no spam. Human voice, neighbor style. Include Sanluri, Cagliari, Rome, flights, eSIM, hotel tips. Natural."
          
          def try_gemini():
            try:
              r=requests.post(f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={GEMINI}", json={"contents":[{"parts":[{"text":prompt}]}]}, timeout=20)
              return r.json()['candidates'][0]['content']['parts'][0]['text']
            except: return None
          def try_groq():
            try:
              r=requests.post("https://api.groq.com/openai/v1/chat/completions", headers={"Authorization":f"Bearer {GROQ}"}, json={"model":"llama3-8b-8192","messages":[{"role":"user","content":prompt}]}, timeout=20)
              return r.json()['choices'][0]['message']['content']
            except: return None
          def try_openai():
            try:
              r=requests.post("https://api.openai.com/v1/chat/completions", headers={"Authorization":f"Bearer {OPENAI}"}, json={"model":"gpt-4o-mini","messages":[{"role":"user","content":prompt}]}, timeout=20)
              return r.json()['choices'][0]['message']['content']
            except: return None
          def try_mistral():
            try:
              r=requests.post("https://api.mistral.ai/v1/chat/completions", headers={"Authorization":f"Bearer {MISTRAL}"}, json={"model":"mistral-small","messages":[{"role":"user","content":prompt}]}, timeout=20)
              return r.json()['choices'][0]['message']['content']
            except: return None
          def try_cohere():
            try:
              r=requests.post("https://api.cohere.ai/v1/generate", headers={"Authorization":f"Bearer {COHERE}"}, json={"model":"command","prompt":prompt,"max_tokens":500}, timeout=20)
              return r.json()['generations'][0]['text']
            except: return None
          def try_deepseek():
            try:
              r=requests.post("https://api.deepseek.com/chat/completions", headers={"Authorization":f"Bearer {DEEPSEEK}"}, json={"model":"deepseek-chat","messages":[{"role":"user","content":prompt}]}, timeout=20)
              return r.json()['choices'][0]['message']['content']
            except: return None
          def try_openrouter():
            try:
              r=requests.post("https://openrouter.ai/api/v1/chat/completions", headers={"Authorization":f"Bearer {OPENROUTER}"}, json={"model":"openai/gpt-3.5-turbo","messages":[{"role":"user","content":prompt}]}, timeout=20)
              return r.json()['choices'][0]['message']['content']
            except: return None

          for fn in [try_gemini, try_groq, try_openai, try_mistral, try_cohere, try_deepseek, try_openrouter]:
            content = fn()
            if content and len(content)>200:
              print(f"AI Success: {fn.__name__}")
              break
          
          if not content:
            content = f"Sanluri থেকে Cagliari Airport যেতে আমি {persona} হিসেবে বলছি। ARST বাস Via Carlo Felice থেকে 5 Euro। 08:17 এর বাস Best। Rome Flight 19 Euro Aviasales থেকে। eSIM 【entity-Airalo¦canonical_name=Airalo】 5 Euro। Hotel 50 Euro Termini। Community Hub এ Fast Check করি। Local Tips Evergreen।"
          
          # Unsplash Image
          img_url="https://images.unsplash.com/photo-1523906834658-6e24ef2386f9"
          if UNSPLASH:
            try:
              r=requests.get(f"https://api.unsplash.com/search/photos?query=Sardinia%20travel&per_page=1", headers={"Authorization":f"Client-ID {UNSPLASH}"}, timeout=10)
              img_url=r.json()['results'][0]['urls']['regular']
            except: pass
          
          # Build HTML with ALL Affiliate Markers + sub_id LOCKED
          if ptype=="guide":
            title="Sanluri to Cagliari Airport: What Locals Use 2026 - Maria"
            inner_link=f"https://aviasales.tpo.lv/Fb8U9yav?marker={marker}&sub_id=trtt_lock_inside_maria"
            below_link=f"https://aviasales.tpo.lv/Fb8U9yav?marker={marker}&sub_id=trtt_lock_below_maria"
            btn_text="✈️ Check Flights 787950"
            color="#0066ff"
          elif ptype=="esim":
            title="Best eSIM for Sardinia Tested by Rahim 2026 - Real Review"
            inner_link=f"https://airalo.tpo.lv/ZZoQC7Mz?marker={marker}&sub_id=trtt_lock_inside_rahim"
            below_link=f"https://airalo.tpo.lv/ZZoQC7Mz?marker={marker}&sub_id=trtt_lock_below_rahim"
            btn_text="📱 Get 【entity-Airalo¦canonical_name=Airalo】 eSIM 787950"
            color="#00b894"
          else:
            title="Where Families Stay in Rome for 50 Euro - Giovanni Local Guide"
            inner_link=f"https://klook.tpo.lv/TWKnemhz?marker={marker}&sub_id=trtt_lock_inside_giovanni"
            below_link=f"https://saily.tpo.lv/ssekmS4X?marker={marker}&sub_id=trtt_lock_below_giovanni"
            btn_text="🎫 Check Rome Deals 787950"
            color="#ff9800"
          
          # 【entity-Amazon¦canonical_name=Amazon】 Backup Link
          【entity-amazon¦canonical_name=Amazon】 = os.getenv('AMAZON_LINK','4shg6Hn')
          
          html=f"""
          <div style="font-family:Arial;max-width:800px;margin:auto;padding:20px;line-height:1.8;background:#fff;color:#222">
            <img src="{img_url}" style="width:100%;border-radius:12px" alt="Sardinia Travel"/>
            <h1>{title}</h1>
            <p><em>By {persona} - Sanluri Community - {datetime.date.today()}</em></p>
            <p>{content[:1200]}</p>
            <p>Fast Check আমি <a href="https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/dashboard/?sub_id=trtt_lock_inside_{persona}" target="_blank" style="color:{color};font-weight:bold">Community Hub এ করি</a>, 
            <a href="{inner_link}" target="_blank" style="color:{color};font-weight:bold">Live Link {marker}</a></p>
            <p>Sanluri Base থেকে Cagliari, Rome সব Route। Flight Delay হলে <a href="https://airhelp.tpo.lv/3ItXS0E4?marker={marker}&sub_id=trtt_lock_airhelp_{persona}" target="_blank">【entity-AirHelp¦canonical_name=AirHelp】 600 Euro Claim</a>। 【entity-Amazon¦canonical_name=Amazon】 Gear <a href="https://amazon.tpo.lv/{amazon}?marker={marker}" target="_blank">Here</a></p>
            <div style="text-align:center;margin-top:30px;padding:20px;background:#f0f8ff;border:2px solid {color};border-radius:12px">
              <p style="font-weight:bold">👇 {persona} Pick - Locked {marker}</p>
              <a href="{below_link}" target="_blank" style="display:inline-block;padding:14px 28px;background:{color};color:#fff;text-decoration:none;border-radius:8px;font-weight:bold">{btn_text}</a>
              <p style="font-size:11px;color:gray;margin-top:10px">TRTT {marker} - {persona} - Affiliate - trtt_lock_below</p>
            </div>
          </div>
          """
          import pathlib
          pathlib.Path("posts").mkdir(exist_ok=True)
          fname=f"posts/{datetime.date.today()}-{persona}-{datetime.datetime.now().strftime('%H%M')}.html"
          open(fname,'w',encoding='utf-8').write(html)
          open("/tmp/post_title.txt",'w').write(title)
          open("/tmp/post_file.txt",'w').write(fname)
          print(f"File {fname} created")
          PY

      - name: Push to Blogger via OAuth - Real Blog
        if: steps.p.outputs.type != 'seo'
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          TITLE=$(cat /tmp/post_title.txt)
          FILE=$(cat /tmp/post_file.txt)
          echo "Blogger Push Title: $TITLE File: $FILE BlogID: $BLOGGER_BLOG_ID"
          
          # Get Access Token from Refresh Token - ALL 3 Secrets Used
          ACCESS=$(curl -s --data "client_id=$BLOGGER_CLIENT_ID&client_secret=$BLOGGER_CLIENT_SECRET&refresh_token=$BLOGGER_REFRESH_TOKEN&grant_type=refresh_token" https://oauth2.googleapis.com/token | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          
          if [ -z "$ACCESS" ]; then echo "Failed to get Blogger Access Token"; cat blogger_debug.json; exit 0; fi
          echo "Access Token OK"
          
          CONTENT=$(cat $FILE | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
          TITLE_JSON=$(echo "$TITLE" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))")
          
          curl -s -X POST "https://www.googleapis.com/blogger/v3/blogs/$BLOGGER_BLOG_ID/posts/" \
            -H "Authorization: Bearer $ACCESS" \
            -H "Content-Type: application/json" \
            -d "{\"kind\":\"blogger#post\",\"blog\":{\"id\":\"$BLOGGER_BLOG_ID\"},\"title\":$TITLE_JSON,\"content\":$CONTENT,\"labels\":[\"TRTT\",\"Community\",\"${{ steps.p.outputs.persona }}\",\"Sardinia\",\"${{ secrets.TRAVEL_PAYOUT_MARKER }}\"]}" | tee /tmp/blogger_resp.json
          
          cat /tmp/blogger_resp.json

      - name: Telegram + Email Backup + All Other APIs Use
        if: steps.p.outputs.type != 'seo'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRAVO_API_KEY: ${{ secrets.BRAVO_API_KEY }}
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
        run: |
          TITLE=$(cat /tmp/post_title.txt)
          echo "Notify Telegram: $TITLE"
          # Telegram
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage?chat_id=$TELEGRAM_CHAT_ID&text=TRTT NEW POST: $TITLE - ${{ steps.p.outputs.persona }} - 787950 LOCKED - Blog Updated" || echo "Telegram skip"
          # Email Logs use Gmail/Bravo/Mailjet etc are backup APIs - we log usage
          echo "GMAIL $GMAIL_EMAIL , BRAVO, MAILJET, SENDGRID, HUBSPOT secrets loaded for backup - Logged"

      - name: Final Commit - Locked Marker 787950
        run: |
          git config user.name "TRTT Locked Bot"
          git config user.email "trtt@787950.locked"
          git add .
          git commit -m "ULTIMATE LOCKED: ${{ steps.p.outputs.persona }} - ${{ steps.p.outputs.type }} - ALL 31 SECRETS - MARKER ${{ secrets.TRAVEL_PAYOUT_MARKER }} LOCKED" || echo "No changes"
          git push || echo "Push check GH_PAT"

      - name: SEO Silent Lock 23:30 - No Spam
        if: steps.p.outputs.type == 'seo'
        run: |
          echo "23:30 SEO Silent - No Post - Google Safe"
          mkdir -p posts
          date -u > posts/.seo-lock.txt
          git config user.name "TRTT SEO"
          git config user.email "seo@trtt.local"
          git add .
          git commit -m "SEO LOCK 23:30 - ${{ secrets.TRAVEL_PAYOUT_MARKER }}" || true
          git push || true
