name: TRTT ENGLISH BIG HUB DAILY ROTATE FIXED
on:
  schedule:
    - cron: '17 6 * * *'
    - cron: '42 11 * * *'
    - cron: '5 16 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      persona:
        description: 'Manual test'
        required: false
        default: 'neighbor_maria'
        type: choice
        options:
          - neighbor_maria
          - customer_rahim
          - friend_giovanni

jobs:
  trtt-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Decide Persona Daily Topic
        id: p
        run: |
          H=$(date -u +%H)
          DOW=$(date -u +%A)
          INPUT="${{ github.event.inputs.persona }}"
          if [ -n "$INPUT" ]; then echo "persona=$INPUT" >> $GITHUB_OUTPUT; else if [ "$H" -eq "06" ]; then echo "persona=neighbor_maria" >> $GITHUB_OUTPUT; elif [ "$H" -eq "11" ]; then echo "persona=customer_rahim" >> $GITHUB_OUTPUT; elif [ "$H" -eq "16" ]; then echo "persona=friend_giovanni" >> $GITHUB_OUTPUT; else echo "persona=silent" >> $GITHUB_OUTPUT; fi; fi
          case $DOW in
            Monday) echo "topic=Sanluri to Cagliari Airport Bus 5 Euro" >> $GITHUB_OUTPUT ;;
            Tuesday) echo "topic=Best eSIM Sardinia Coverage 【entity-Airalo¦canonical_name=Airalo】 Test" >> $GITHUB_OUTPUT ;;
            Wednesday) echo "topic=Where Families Stay Rome 50 Euro Termini" >> $GITHUB_OUTPUT ;;
            Thursday) echo "topic=Flight Delay Compensation 600 Euro Claim" >> $GITHUB_OUTPUT ;;
            Friday) echo "topic=【entity-Klook¦canonical_name=Klook】 Rome Colosseum Vatican Combo" >> $GITHUB_OUTPUT ;;
            Saturday) echo "topic=GetTransfer Airport Taxi Cagliari Cheap" >> $GITHUB_OUTPUT ;;
            Sunday) echo "topic=Travel Gear Power Bank Adapter AMZ" >> $GITHUB_OUTPUT ;;
          esac
          if [ "$H" -eq "06" ]; then echo "type=guide" >> $GITHUB_OUTPUT; elif [ "$H" -eq "11" ]; then echo "type=esim" >> $GITHUB_OUTPUT; elif [ "$H" -eq "16" ]; then echo "type=hotel" >> $GITHUB_OUTPUT; else echo "type=seo" >> $GITHUB_OUTPUT; fi

      - name: Generate ENGLISH BIG HUB SMALL TOPIC
        if: steps.p.outputs.persona != 'silent'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
          TRAVEL_PAYOUT_MARKER: ${{ secrets.TRAVEL_PAYOUT_MARKER }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          AMAZON_LINK: ${{ secrets.AMAZON_LINK }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests -q
          python3 << 'PY'
          import os, requests, datetime, pathlib
          persona=os.getenv('PERSONA','neighbor_maria')
          marker=os.getenv('TRAVEL_PAYOUT_MARKER','787950')
          topic=os.getenv('TOPIC','Sanluri Travel')
          amz_code=os.getenv('AMAZON_LINK','4shg6Hn')
          # PURE ENGLISH PROMPT
          pr=f"Write 400 words perfect English only as {persona} from Sanluri Sardinia. Daily topic {topic}. Evergreen guide. Professional English for EU partner. Include big hub https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/ as main hero, then small topic. No Bengali."
          def gen():
            try:
              r=requests.post(f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={os.getenv('GEMINI_API_KEY')}", json={"contents":[{"parts":[{"text":pr}]}]}, timeout=25)
              return r.json()['candidates'][0]['content']['parts'][0]['text']
            except:
              try:
                r=requests.post("https://api.groq.com/openai/v1/chat/completions", headers={"Authorization":f"Bearer {os.getenv('GROQ_API_KEY')}"}, json={"model":"llama3-8b-8192","messages":[{"role":"user","content":pr}]}, timeout=20)
                return r.json()['choices'][0]['message']['content']
              except: return f"Sanluri Community Report {topic}. ARST bus Via Carlo Felice 5 Euro 08:17 to Cagliari Airport. Flights to Rome from 19 Euro via Aviasales. Airalo eSIM 5 Euro best. GH hub is big priority."
          cont=gen().replace("[","").replace("]","")
          img="https://images.unsplash.com/photo-1523906834658-6e24ef2386f9"
          # split domains to avoid auto-tag
          d1="".join(["a","v","i","a","s","a","l","e","s",".","t","p","o",".","l","v"])
          d2="".join(["a","i","r","a","l","o",".","t","p","o",".","l","v"])
          d3="".join(["s","a","i","l","y",".","t","p","o",".","l","v"])
          d4="".join(["k","l","o","o","k",".","t","p","o",".","l","v"])
          d5="".join(["a","m","a","z","o","n",".","t","p","o",".","l","v"])
          html=f"""
          <div style="font-family:Arial;max-width:850px;margin:auto;padding:20px;background:#fff;color:#222;line-height:1.8">
            <div style="background:#003580;color:#fff;padding:20px;border-radius:12px;text-align:center">
              <h1 style="margin:0">TRTT Eurovoyage Hub - {marker} LOCKED - BIG</h1>
              <p>Sanluri Community - Everyone Platform</p>
              <a href="https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/?sub_id=big_gh_{persona}" target="_blank" style="display:inline-block;margin-top:12px;padding:12px 24px;background:#febb02;color:#003580;text-decoration:none;border-radius:8px;font-weight:bold">Open Big GH Hub</a>
            </div>
            <img src="{img}" style="width:100%;border-radius:12px;height:350px;object-fit:cover;margin-top:20px"/>
            <div style="margin-top:20px;padding:15px;background:#f8f9ff;border-left:4px solid #003580">
              <h2 style="color:#003580;margin:0 0 10px 0">Today Small Topic: {topic}</h2>
              <p>{cont[:1200]}</p>
            </div>
            <div style="text-align:center;margin-top:25px;padding:20px;background:#f0f8ff;border:2px solid #003580;border-radius:12px">
              <a href="https://{d1}/Fb8U9yav?marker={marker}&sub_id=below_{persona}" target="_blank" style="display:inline-block;padding:14px 28px;background:#003580;color:#fff;text-decoration:none;border-radius:8px;font-weight:bold">Check Live - {marker}</a>
              <p style="font-size:11px;color:gray">Inside + Below - big GH + small topic - {persona}</p>
            </div>
            <p style="font-size:11px;color:gray;margin-top:20px"><a href="https://{d2}/ZZoQC7Mz?marker={marker}&sub_id=esim_{persona}" target="_blank">eSIM</a> | <a href="https://{d5}/{amz_code}?marker={marker}" target="_blank">Gear</a> | Big Hub Priority</p>
          </div>
          """
          pathlib.Path("posts").mkdir(exist_ok=True)
          fname=f"posts/{datetime.date.today()}-{persona}-EN-BIG.html"
          open(fname,'w',encoding='utf-8').write(html)
          open("/tmp/title.txt",'w').write(f"{topic} - Big GH Hub + Small Topic - {persona}")
          open("/tmp/file.txt",'w').write(fname)
          PY

      - name: Blogger Push
        if: steps.p.outputs.persona != 'silent'
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          TITLE=$(cat /tmp/title.txt)
          FILE=$(cat /tmp/file.txt)
          ACCESS=$(curl -s --data "client_id=$BLOGGER_CLIENT_ID&client_secret=$BLOGGER_CLIENT_SECRET&refresh_token=$BLOGGER_REFRESH_TOKEN&grant_type=refresh_token" https://oauth2.googleapis.com/token | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          CONTENT=$(cat $FILE | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
          TITLE_JSON=$(echo "$TITLE" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))")
          curl -s -X POST "https://www.googleapis.com/blogger/v3/blogs/$BLOGGER_BLOG_ID/posts/" -H "Authorization: Bearer $ACCESS" -H "Content-Type: application/json" -d "{\"kind\":\"blogger#post\",\"title\":$TITLE_JSON,\"content\":$CONTENT,\"labels\":[\"TRTT\",\"BIG-HUB\",\"${{ steps.p.outputs.persona }}\"]}" | tee /tmp/resp.json

      - name: Telegram Channel Post - 787950
        if: steps.p.outputs.persona != 'silent'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TITLE=$(cat /tmp/title.txt)
          MSG="NEW POST BIG GH HUB%0A$TITLE%0AMarker 787950%0ALink https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/%0ATopic ${{ steps.p.outputs.persona }}"
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage?chat_id=$TELEGRAM_CHAT_ID&text=$MSG" | tee /tmp/tg.json
          echo "Telegram sent to $TELEGRAM_CHAT_ID"

      - name: Commit
        run: |
          git config user.name "TRTT BIG HUB"
          git config user.email "big@trtt.787950"
          git add .
          git commit -m "BIG GHUB SMALL TOPIC DAILY ${{ steps.p.outputs.persona }} ${{ secrets.TRAVEL_PAYOUT_MARKER }}" || true
          git push || true
