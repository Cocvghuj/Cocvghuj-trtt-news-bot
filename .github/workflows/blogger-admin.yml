name: Blogger Admin and Comments

on:
  workflow_dispatch:
    # DISABLED backup - kept for future

  push:
    branches: [main]
    paths:
      - 'scripts/blogger_admin.py'
      - '.github/workflows/blogger-admin.yml'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Choose a read-only audit or a comment moderation action'
        required: true
        type: choice
        default: audit
        options:
          - audit
          - list_comments
          - approve
          - mark_spam
          - delete
      post_id:
        description: 'Required for approve / mark_spam / delete'
        required: false
        type: string
      comment_id:
        description: 'Required for approve / mark_spam / delete'
        required: false
        type: string
      confirm_delete:
        description: 'For deletion only, type DELETE:<comment_id> exactly'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: trtt-blogger-admin
  cancel-in-progress: false

jobs:
  blogger-admin:
    if: false
    name: Blogger audit and comment management
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Blogger admin operation
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_OPERATION: ${{ github.event_name == 'push' && 'audit' || inputs.operation }}
          BLOGGER_POST_ID: ${{ inputs.post_id }}
          BLOGGER_COMMENT_ID: ${{ inputs.comment_id }}
          BLOGGER_CONFIRM_DELETE: ${{ inputs.confirm_delete }}
        run: python scripts/blogger_admin.py
