name: Retired legacy workflow - use TRTT News Blogger Drafts
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo "::error::This legacy workflow is retired to prevent duplicate publishers, live publishing, and untracked pushes."
          echo "Use .github/workflows/trtt-english-news-drafts.yml for the single verified DRAFT-only workflow."
          exit 1
