name: Gemini Full Auto

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  gemini-auto:
    if: contains(github.event.comment.body, '@gemini') && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Call Gemini and Reply
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK_TEXT: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import os, json, urllib.request, urllib.error, time

          task = os.environ.get("TASK_TEXT", "Hello")
          API_KEY = os.environ["GEMINI_API_KEY"]
          answer = None
          error_log = ""

          # ১. আগে গুগলরে জিগাও কোন মডেল আছে
          try:
              list_url = f"https://generativelanguage.googleapis.com/v1beta/models?key={API_KEY}"
              with urllib.request.urlopen(list_url, timeout=30) as resp:
                  data = json.loads(resp.read())
              # যেগুলা generateContent সাপোর্ট করে
              models = []
              for m in data.get("models", []):
                  name = m.get("name", "").replace("models/", "")
                  methods = m.get("supportedGenerationMethods", [])
                  if "generateContent" in methods:
                      models.append(name)
              print(f"Found models: {models}")
              # 2.5 ফ্ল্যাশ আগে, না পাইলে যেকোনোটা
              models.sort(key=lambda x: (0 if "2.5-flash" in x else 1 if "flash" in x else 2))
          except Exception as e:
              print(f"List models failed: {e}")
              models = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash"]

          # ২. এবার একটা একটা কইরা চেষ্টা কর
          for model in models[:5]:
              print(f"Trying model: {model}")
              url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
              body = {"contents": [{"parts": [{"text": f"You are TRTT Worker. Reply in Bengali, friendly, short. Task: {task}"}]}]}
              try:
                  req = urllib.request.Request(url, data=json.dumps(body).encode("utf-8"), headers={"Content-Type": "application/json", "x-goog-api-key": API_KEY})
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      data = json.loads(resp.read())
                  answer = data["candidates"][0]["content"]["parts"][0]["text"]
                  print(f"SUCCESS with {model}")
                  break
              except urllib.error.HTTPError as e:
                  err = e.read().decode()[:1000]
                  print(f"Failed {model}: {e.code} {err}")
                  error_log = f"{e.code} {err}"
              except Exception as e:
                  print(f"Failed {model}: {e}")
                  error_log = str(e)

          if not answer:
              # এইবার আসল এররটাই দেখাইবো, যাতে বুঝতে পারি
              if "API key not valid" in error_log or "400" in error_log:
                  answer = "বেটা, তোর চাবি (API KEY) ভুল! Settings > Secrets এ যাইয়া নতুন চাবি লাগা। এরর: " + error_log[:300]
              else:
                  answer = f"বেটা, গুগল থেকে এরর আসছে, আমি দেখতেছি: {error_log[:500]}"

          print(answer[:2000])

          comment_url = f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['ISSUE_NUMBER']}/comments"
          comment_body = {"body": f"### 🤖 Gemini উত্তর দিছে:\n\n{answer}\n\n---\n*TRTT News Bot | Powered by Gemini*"}
          req2 = urllib.request.Request(comment_url, data=json.dumps(comment_body).encode("utf-8"), headers={"Content-Type": "application/json", "Authorization": f"Bearer {os.environ['GH_TOKEN']}"})
          with urllib.request.urlopen(req2) as r:
              print("Comment posted:", r.status)
          PY
