name: Gemini Full Auto

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  gemini-auto:
    if: >-
      (github.event_name == 'issue_comment' && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@gemini')) ||
      (github.event_name == 'issues' && github.event.issue.author_association == 'OWNER' && contains(github.event.issue.body, '@gemini'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          TASK_TEXT: ${{ github.event.comment.body || github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request, time

          task = os.environ.get("TASK_TEXT", "Hello")[:2000].replace("\n", " ")
          model = os.environ["GEMINI_MODEL"]
          url = ("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent")
          body = {"contents": [{"parts": [{"text": "You are TRTT Worker. Task: " + task}]}]}

          print("Calling Gemini model:", model)
          for attempt in range(3):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(body).encode("utf-8"),
                  headers={"Content-Type": "application/json", "x-goog-api-key": os.environ["GEMINI_API_KEY"]},
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      data = json.load(resp)
                  break
              except urllib.error.HTTPError as e:
                  print(f"Attempt {attempt+1} failed: HTTP {e.code} -", e.read().decode("utf-8", "replace")[:1000])
                  if attempt == 2:
                      print("Gemini request failed after 3 tries")
                      sys.exit(1)
                  time.sleep(5)
              except Exception as e:
                  print(f"Attempt {attempt+1} failed:", e)
                  if attempt == 2:
                      print("Gemini request failed after 3 tries")
                      sys.exit(1)
                  time.sleep(5)

          try:
              text = data["candidates"][0]["content"]["parts"][0]["text"]
          except (KeyError, IndexError, TypeError):
              print("Unexpected Gemini response:", json.dumps(data)[:2000])
              sys.exit(1)

          print(text[:3000])
          PY
