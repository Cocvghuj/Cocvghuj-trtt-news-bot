name: Gemini Full Auto

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  gemini-auto:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@gemini'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Call Gemini API - Fixed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK_TEXT: ${{ github.event.comment.body || github.event.issue.body }}
        run: |
          echo "Calling Gemini API..."
          python3 -c "
          import json, os, urllib.request
          task = os.environ.get('TASK_TEXT','Hello')
          # শুধু প্রথম 2000 অক্ষর নাও - JSON ভাঙ্গবো না
          task = task[:2000].replace(chr(10),' ')
          body = {'contents': [{'parts': [{'text': 'You are TRTT Worker. Only trtt-control/. V106 TRTT MAC-787950 LOCKED. Task: ' + task}]}]}
          req = urllib.request.Request(
            'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + os.environ['GEMINI_API_KEY'],
            data=json.dumps(body).encode(),
            headers={'Content-Type': 'application/json'}
          )
          try:
              resp = urllib.request.urlopen(req)
              print(resp.read().decode()[:3000])
          except Exception as e:
              print('Gemini Error:', e)
              try:
                  print(e.read().decode()[:2000])
              except:
                  pass
          "
          echo "Gemini API Called - Done"
