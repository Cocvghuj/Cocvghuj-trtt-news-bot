name: FlightScoutPro Single News Draft

on:
  workflow_dispatch:
    inputs:
      article_title:
        description: "Exact article title"
        required: true
        type: string
      article_html:
        description: "Complete article HTML (including source links)"
        required: true
        type: string
      article_labels:
        description: "Comma-separated Blogger labels"
        required: false
        default: "FlightScoutPro,Travel News,Aviation"
        type: string

concurrency:
  group: flightscoutpro-single-draft
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-one-flightscoutpro-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Blogger API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Create or confirm exactly one FlightScoutPro DRAFT
        env:
          FLIGHTSCOUTPRO_BLOG_ID: ${{ secrets.FLIGHTSCOUTPRO_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          ARTICLE_TITLE: ${{ inputs.article_title }}
          ARTICLE_HTML: ${{ inputs.article_html }}
          ARTICLE_LABELS: ${{ inputs.article_labels }}
        run: python flightscoutpro_single_draft.py
