name: FlightScoutPro Single News Draft

on:
  push:
    branches:
      - main
    paths:
      - "news/flightscoutpro-single-draft.json"
      - ".github/workflows/flightscoutpro-single-draft.yml"
      - "flightscoutpro_single_draft.py"
  workflow_dispatch:

concurrency:
  group: flightscoutpro-single-draft
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-one-flightscoutpro-draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Blogger API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Create or confirm exactly one FlightScoutPro DRAFT
        env:
          FLIGHTSCOUTPRO_BLOG_ID: ${{ secrets.FLIGHTSCOUTPRO_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          ARTICLE_PAYLOAD: news/flightscoutpro-single-draft.json
        run: python flightscoutpro_single_draft.py
