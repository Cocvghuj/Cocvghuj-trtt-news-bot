name: TRTT Blogger to Telegram Auto-Forward

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trtt-blogger-telegram-forward
  cancel-in-progress: false

jobs:
  forward-published-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore Telegram delivery state
        uses: actions/cache/restore@v4
        with:
          path: .telegram-state
          key: trtt-telegram-state-\${{ github.run_id }}-\${{ github.run_attempt }}
          restore-keys: |
            trtt-telegram-state-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Forward newly published Blogger posts
        env:
          TELEGRAM_BOT_TOKEN: \${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: \${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_blogger_feed.py
      - name: Save Telegram delivery state
        uses: actions/cache/save@v4
        if: success()
        with:
          path: .telegram-state
          key: trtt-telegram-state-\${{ github.run_id }}-\${{ github.run_attempt }}
