name: Blogger Read-only OAuth Check
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-blogger-oauth:
    name: Verify Blogger OAuth without changing the blog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blogger API client
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth
      - name: Read-only Blogger API verification
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError
          names = ("BLOGGER_BLOG_ID", "BLOGGER_CLIENT_ID", "BLOGGER_CLIENT_SECRET", "BLOGGER_REFRESH_TOKEN")
          missing = [name for name in names if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing required Blogger settings: " + ", ".join(missing))
          try:
              credentials = Credentials(
                  token=None,
                  refresh_token=os.environ["BLOGGER_REFRESH_TOKEN"],
                  token_uri="https://oauth2.googleapis.com/token",
                  client_id=os.environ["BLOGGER_CLIENT_ID"],
                  client_secret=os.environ["BLOGGER_CLIENT_SECRET"],
                  scopes=["https://www.googleapis.com/auth/blogger"],
              )
              service = build("blogger", "v3", credentials=credentials, cache_discovery=False)
              blog = service.blogs().get(blogId=os.environ["BLOGGER_BLOG_ID"]).execute()
              print("CONFIRMED: Blogger OAuth read-only blogs.get succeeded.")
              print("Blog ID: " + str(blog.get("id", "")))
              print("Blog name: " + str(blog.get("name", "")))
              print("No posts or pages were changed.")
          except HttpError as error:
              print("Blogger API HTTP error: " + str(error.resp.status))
              raise
          PY
