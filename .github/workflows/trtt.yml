name: TRTT News 24 BD Auto Publisher

on:
  schedule:
    # ইতালির সময় অনুযায়ী প্রতিদিন ৩ বার (প্রতি ৮ ঘণ্টা পর পর):
    # ১. সকাল ০৬:০০ টা (ইতালি) = 04:00 UTC
    # ২. দুপুর ০২:০০ টা (ইতালি) = 12:00 UTC
    # ৩. রাত ১০:০০ টা (ইতালি) = 20:00 UTC
    - cron: '0 4,12,20 * * *'

  workflow_dispatch:      # ম্যানুয়ালি রান করানোর অপশন

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write     # posted_history.json কমিট করার পারমিশন

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests google-genai google-auth google-auth-oauthlib google-api-python-client

      - name: Run Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CONSOLE_API_KEY: ${{ secrets.CONSOLE_API_KEY }}
          DEEP_SEEK_KEY: ${{ secrets.DEEP_SEEK_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
        run: |
          python automation.py
