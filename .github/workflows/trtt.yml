name: TRTT All In One

on:
  schedule:
    - cron: '0 * * * *'  # ২৪ ঘণ্টার প্রতি ঘণ্টার প্রথম মিনিটে ১ বার রান হবে
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI feedparser requests Pillow google-genai google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOGGER_ID: ${{ secrets.BLOGGER_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python automation.py

      - name: Save
        run: |
          git config --global user.name 'TRTT Bot'
          git config --global user.email 'bot@trtt.com'
          git add -A || true
          git commit -m "auto save [skip ci]" || true
          git push || true
