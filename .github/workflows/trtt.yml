name: TRTT News 24 BD Auto Publisher

on:
  schedule:
    # ইতালি সময় অনুযায়ী প্রতিদিন ৬টি ভিন্ন সময়ে রান করার ক্রন (UTC টাইমে কনভার্ট করা):
    # সকাল 10:00 AM (ইতালি) = 08:00 UTC -> '0 8 * * *'
    # দুপুর 12:00 PM (ইতালি) = 10:00 UTC -> '0 10 * * *'
    # দুপুর 02:00 PM (ইতালি) = 12:00 UTC -> '0 12 * * *'
    # বিকাল 04:00 PM (ইতালি) = 14:00 UTC -> '0 14 * * *'
    # সন্ধ্যা 06:00 PM (ইতালি) = 16:00 UTC -> '0 16 * * *'
    # রাত   09:00 PM (ইতালি) = 19:00 UTC -> '0 19 * * *'
    - cron: '0 8,10,12,14,16,19 * * *'
    
  workflow_dispatch:           # ম্যানুয়ালি রান করানোর অপশন

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write            # posted_history.json কমিট করার পার্মিশন

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests google-genai google-auth google-auth-oauthlib google-api-python-client

      - name: Run Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python automation.py
