name: TRTT Auto Post - Blog + Telegram

on:
  schedule:
    - cron: '0 4 * * *'   # সকাল ১০টা BD - দিনের ১ম পোস্ট
    - cron: '0 16 * * *'  # রাত ১০টা BD - দিনের ২য় পোস্ট
  workflow_dispatch: # হাতে Run করার জন্য

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install libraries
        run: |
          pip install feedparser
          pip install google-generativeai
          pip install google-api-python-client
          pip install google-auth
          pip install requests

      - name: Run Auto Poster
        run: python automation.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_ID: ${{ secrets.BLOGGER_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
