name: TRTT News 24 BD Auto Publisher

on:
  schedule:
    # ইতালির সময় অনুযায়ী প্রতিদিন ৩ বার (প্রতি ৮ ঘণ্টা পরপর) রান করার জন্য (UTC টাইমে কনভার্ট করা):
    # ১. সকাল ০৬:০০ টা (ইতালি) = 04:00 UTC -> '0 4 * * *'
    # ২. দুপুর ০২:০০ টা (ইতালি) = 12:00 UTC -> '0 12 * * *'
    # ৩. রাত   ১০:০০ টা (ইতালি) = 20:00 UTC -> '0 20 * * *'
    - cron: '0 4,12,20 * * *'

  workflow_dispatch:     # ম্যানুয়ালি রান করানোর অপশন

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # posted_history.json কমিট করার পারমিশন

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests google-genai google-auth google-auth-oauthlib google-api-python-client

      - name: Run Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python automation.py
