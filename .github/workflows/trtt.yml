name: TRTT All In One

on:
  schedule:
    - cron: '0 2,8,11,14,16,20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # এখানে Pillow সহ প্রয়োজনীয় সব লাইব্রেরি যুক্ত করা হয়েছে
      - name: Install Dependencies
        run: pip install requests feedparser beautifulsoup4 google-api-python-client google-auth-httplib2 google-auth-oauthlib pyTelegramBotAPI facebook-sdk Pillow

      - name: Run Bot
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          BLOGGER_ID: ${{ secrets.BLOGGER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python automation.py

      # সঠিক সিকোয়েন্সে গিট কমান্ডগুলো সাজানো হয়েছে
      - name: Save
        run: |
          git config --global user.name 'TRTT Bot'
          git config --global user.email 'bot@trtt.com'
          git pull origin main --rebase || true
          git add posted.json posted.txt final_post.jpg tips_evergreen.json history.txt || true
          git commit -m "auto" || true
          git push origin main || true
