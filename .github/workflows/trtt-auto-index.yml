# Marker: 787950 LOCKED
name: TRTT Auto Google Index
on:
  workflow_dispatch:
    inputs:
      reviewed_post_urls:
        description: "HTTPS public post URLs already reviewed and manually published (one URL per line)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify-reviewed:
    name: Notify discovery only for explicitly reviewed public URLs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notifier dependency
        run: python -m pip install requests
      - name: Notify reviewed published URLs only
        env:
          REVIEWED_POST_URLS: ${{ inputs.reviewed_post_urls }}
        run: python trtt_auto_google_index.py
