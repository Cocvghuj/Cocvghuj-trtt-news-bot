name: TRTT Master Servant - 3x DAILY
on:
  schedule:
    - cron: '0 6,14,22 * * *'
  workflow_dispatch:

jobs:
  work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Servant 1 - Google Writes News
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID || vars.BLOGGER_BLOG_ID }}
          FLIGHTSCOUTPRO_BLOG_ID: ${{ secrets.FLIGHTSCOUTPRO_BLOG_ID || vars.FLIGHTSCOUTPRO_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRAVEL_PAYOUT_MARKER: ${{ secrets.TRAVEL_PAYOUT_MARKER || vars.TRAVEL_PAYOUT_MARKER || '787950' }}
        run: |
          pip install -r requirements.txt
          python trtt_787950_master.py

      - name: Servant 2 - ChatGPT Fixes Design
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pip install feedparser requests beautifulsoup4
          python trtt_auto_google_index.py

      - name: Push to Showroom - Vercel + Blogger
        run: |
          git config user.name "TRTT Bot"
          git config user.email "bot@trtt.com"
          git add .
          git commit -m "Servant work: $(date) - Marker 787950 LOCKED" || exit 0
          git push origin main
