name: TRTT Master Servant - 3x DAILY

# Marker 787950 LOCKED - Main Production Servant
on:
  schedule:
    - cron: '0 6,14,22 * * *'
  workflow_dispatch:

concurrency:
  group: trtt-master-servant
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 google-auth google-auth-oauthlib google-api-python-client google-genai

      - name: Servant 1 - Google Writes News & Publishes to Both Blogs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID || secrets.BLOGGER_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET || secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_BLOG_ID_2: ${{ secrets.BLOGGER_BLOG_ID_2 || secrets.FLIGHTSCOUTPRO_BLOG_ID }}
          TRAVEL_MARKER: "787950 LOCKED"
        run: |
          python trtt_787950_master.py

      - name: Servant 2 - Ping Google Sitemaps and PubSubHubbub
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_BLOG_ID_2: ${{ secrets.BLOGGER_BLOG_ID_2 || secrets.FLIGHTSCOUTPRO_BLOG_ID }}
          FLIGHTSCOUTPRO_BLOG_ID: ${{ secrets.FLIGHTSCOUTPRO_BLOG_ID || secrets.BLOGGER_BLOG_ID_2 }}
        run: |
          python trtt_auto_google_index.py

      - name: Push to Showroom - Vercel + Blogger
        run: |
          git config user.name "TRTT Bot [787950]"
          git config user.email "bot@trttnews24bd.com"
          git add drafted_history.txt news/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Servant work: $(date -u +'%Y-%m-%d %H:%M UTC') - Marker 787950 LOCKED [skip ci]" || exit 0
            git push origin main || echo "Push skipped or branch protected."
          fi
