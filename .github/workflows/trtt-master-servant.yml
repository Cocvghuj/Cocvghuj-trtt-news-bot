# Marker: 787950 LOCKED
name: TRTT Master Servant - MANUAL ONLY (quality review required)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trtt-daily-draft
  cancel-in-progress: false

jobs:
  draft:
    name: Create at most one Blogger draft per Italy calendar day
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile draft engine
        run: python -m py_compile trtt_787950_master.py
      - name: Create one Blogger draft only
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID || vars.BLOGGER_BLOG_ID }}
          FLIGHTSCOUTPRO_BLOG_ID: ${{ secrets.FLIGHTSCOUTPRO_BLOG_ID || vars.FLIGHTSCOUTPRO_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          TRAVEL_PAYOUT_MARKER: '787950'
        run: python trtt_787950_master.py
