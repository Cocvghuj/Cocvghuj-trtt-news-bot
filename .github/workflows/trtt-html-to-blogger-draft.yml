name: TRTT HTML to Blogger Draft (never publish)

on:
  push:
    branches: [main]
    paths:
      - "blog/drafts/*.html"
  workflow_dispatch:
    inputs:
      file_path:
        description: "Existing merged HTML file under blog/drafts/"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trtt-blogger-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-trtt-blogger-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout merged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Blogger API client
        run: python -m pip install google-api-python-client google-auth

      - name: Create one verified draft for each changed article
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            mapfile -t files < <(git ls-files 'blog/drafts/*.html')
          else
            mapfile -t files < <(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'blog/drafts/*.html')
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Blogger HTML drafts found."
            exit 0
          fi
          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            python scripts/create_blogger_html_draft.py "$file"
          done

      - name: Create one manually selected verified draft
        if: github.event_name == 'workflow_dispatch'
        env:
          FILE_PATH: ${{ inputs.file_path }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python scripts/create_blogger_html_draft.py "$FILE_PATH"
