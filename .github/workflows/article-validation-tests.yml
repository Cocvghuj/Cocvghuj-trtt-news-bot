name: Article Validation Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "config.py"
      - "affiliate-services.json"
      - "affiliate-links.js"
      - "index.html"
      - "super-app.html"
      - "build.js"
      - "package.json"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/article-validation-tests.yml"
      - ".github/workflows/trtt-unified-autopilot.yml"
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "config.py"
      - "affiliate-services.json"
      - "affiliate-links.js"
      - "index.html"
      - "super-app.html"
      - "build.js"
      - "package.json"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/article-validation-tests.yml"
      - ".github/workflows/trtt-unified-autopilot.yml"

permissions:
  contents: read

jobs:
  validate-articles:
    name: Run safe validation and storefront build checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install import dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-auth google-api-python-client requests python-slugify
      - name: Run tests (no Blogger publishing)
        run: python -m unittest discover -s tests -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check affiliate synchronizer syntax
        run: node --check affiliate-links.js
      - name: Build Vercel static output
        run: npm run build
      - name: Verify affiliate assets in Vercel output
        run: |
          test -s dist/index.html
          test -s dist/super-app.html
          test -s dist/affiliate-services.json
          test -s dist/affiliate-links.js
          test -s dist/manifest.json
          test -s dist/robots.txt
          test ! -e dist/main.py
          test ! -e dist/config.py
          test ! -e dist/partners.json
          test ! -e dist/requirements.txt
          test ! -e dist/package.json
          test ! -e dist/build.js
          test ! -e dist/README.md
          test ! -d dist/tests
