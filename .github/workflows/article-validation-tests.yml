name: Article Validation Tests

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
    paths:
      - "main.py"
      - "config.py"
      - "affiliate-services.json"
      - "affiliate-links.js"
      - "index.html"
      - "super-app.html"
      - "ai.js"
      - "api/**"
      - "lib/**"
      - "command-center/**"
      - "build.js"
      - "package.json"
      - "requirements.txt"
      - "vercel.json"
      - "tests/**"
      - ".github/workflows/article-validation-tests.yml"
      - ".github/workflows/trtt-unified-autopilot.yml"
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "config.py"
      - "affiliate-services.json"
      - "affiliate-links.js"
      - "index.html"
      - "super-app.html"
      - "ai.js"
      - "api/**"
      - "lib/**"
      - "command-center/**"
      - "build.js"
      - "package.json"
      - "requirements.txt"
      - "vercel.json"
      - "tests/**"
      - ".github/workflows/article-validation-tests.yml"
      - ".github/workflows/trtt-unified-autopilot.yml"

permissions:
  contents: read

jobs:
  validate-articles:
    name: Run safe validation, Command Center tests and storefront build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install import dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-auth google-api-python-client requests python-slugify
      - name: Run existing safe article tests (no Blogger publishing)
        run: python -m unittest discover -s tests -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Command Center security and integration tests
        run: npm test
      - name: Check JavaScript syntax and secret exposure
        run: |
          node --check ai.js
          node --check api/command-center/health.js
          node --check api/command-center/chat.js
          node --check api/command-center/events.js
          node --check api/command-center/backup.js
          node --check lib/command-center/auth.js
          node --check lib/command-center/policy.js
          node --check lib/command-center/providers.js
          node --check lib/command-center/google.js
          node --check lib/command-center/audit.js
          node --check lib/command-center/ai-router.js
          ! grep -Eq 'sk-or-v1-[A-Za-z0-9]+' ai.js
      - name: Verify Vercel build configuration
        run: |
          python -c "import json; c=json.load(open('vercel.json', encoding='utf-8')); assert c['buildCommand'] == 'npm run build'; assert c['outputDirectory'] == 'dist'"
      - name: Build Vercel static output
        run: npm run build
      - name: Verify public and private asset boundaries
        run: |
          test -s dist/index.html
          test -s dist/super-app.html
          test -s dist/affiliate-services.json
          test -s dist/affiliate-links.js
          test -s dist/manifest.json
          test -s dist/robots.txt
          test -s dist/ai.js
          test ! -e dist/main.py
          test ! -e dist/config.py
          test ! -e dist/partners.json
          test ! -e dist/requirements.txt
          test ! -e dist/package.json
          test ! -e dist/build.js
          test ! -e dist/README.md
          test ! -d dist/tests
          test ! -d dist/api
          test ! -d dist/lib
          test ! -d dist/command-center
