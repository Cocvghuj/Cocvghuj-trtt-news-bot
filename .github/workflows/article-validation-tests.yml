name: Article Validation Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "tests/**"
      - ".github/workflows/article-validation-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "tests/**"
      - ".github/workflows/article-validation-tests.yml"

permissions:
  contents: read

jobs:
  validate-articles:
    name: Run safe article validation tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install import dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-auth google-api-python-client requests python-slugify
      - name: Run tests (no Blogger publishing)
        run: python -m unittest discover -s tests -v
