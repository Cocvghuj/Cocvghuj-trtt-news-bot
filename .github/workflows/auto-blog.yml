name: TRTT Auto Blog - Rise From Ashes
on:
  schedule:
    - cron: '0 10 */3 * *' # প্রতি ৩ দিন পর পর সকাল ১০টায়
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Create New Blog Post
        run: |
          echo "🔥 TRTT Voyage - New Post Created!"
          echo "Rise From Ashes - $(date)" > post-$(date +%Y-%m-%d).md
      - name: Send to Telegram
        run: |
          curl -s -X POST https://api.telegram.org/botYOUR_BOT_TOKEN/sendMessage -d chat_id=YOUR_CHANNEL_ID -d text="🔥 New TRTT Blog Published! Rise From Ashes!"
