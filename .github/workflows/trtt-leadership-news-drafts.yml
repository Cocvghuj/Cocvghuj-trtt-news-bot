name: TRTT Leadership News - Create Blogger Drafts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-two-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Blogger dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth markdown

      - name: Create and verify English and Bengali drafts
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python scripts/create_leadership_news_drafts.py
