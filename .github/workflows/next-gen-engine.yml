ণname: Next Gen Engine
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install google-generativeai requests
          fi

      - name: Install Dependencies
        run: pip install google-generativeai requests python-slugify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRAVEL_PAYOUT_MARKER: "787950"

      - name: Run main generator
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRAVEL_PAYOUT_MARKER: "787950"

      - name: Auto commit generated content
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: sync travel content with marker 787950"
