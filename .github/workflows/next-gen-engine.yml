name: Daily Evergreen Guide & Social Media Share

on:
  schedule:
    # প্রতিদিন ১ বার রান হবে (সকাল ৮:০০ UTC / বাংলাদেশ সময় দুপুর ২:০০ টা)
    - cron: '0 8 * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার জন্য

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai requests python-slugify

      - name: Run Python Automation Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRAVEL_PAYOUT_MARKER: ${{ secrets.TRAVEL_PAYOUT_MARKER }}
        run: python bot_social_engine.py

      - name: Save History & Commit Changes
        run: |
          git config --global user.name "TRTT Automation Bot"
          git config --global user.email "bot@trttnews24bd.com"
          git add published_history.txt || true
          git commit -m "Update published history [skip ci]" || true
          git push
