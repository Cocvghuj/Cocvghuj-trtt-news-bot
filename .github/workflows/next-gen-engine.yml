name: Blog Sync to Base44 Auto

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # প্রতি ৩০ মিনিট পর পর রান হবে (প্রয়োজনমতো পরিবর্তন করতে পারেন)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade google-generativeai

    - name: Run Main Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "TRTT Bot"
        git config --global user.email "bot@users.noreply.github.com"
        git pull origin main --rebase || echo "No changes to pull"
        git add .
        git commit -m "Auto Blog Sync 787950 - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
        git push origin main
