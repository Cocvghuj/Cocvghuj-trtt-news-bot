name: Next-Gen Autonomous Travel Content Engine

on:
  schedule:
    - cron: '30 5 * * *' # প্রতিদিন নির্দিষ্ট সময়ে স্বয়ংক্রিয়ভাবে ট্রিগার হবে
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests google-auth google-auth-oauthlib google-api-python-client

      - name: Execute Autonomous Content Miner & Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEP_SEEK_KEY: ${{ secrets.DEEP_SEEK_KEY }}
          TRAVEL_PAYOUT_MARKER: ${{ secrets.TRAVEL_PAYOUT_MARKER }}
          AMAZON_LINK: ${{ secrets.AMAZON_LINK }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/next_gen_engine.py
