name: ROKSANA VAULT - Direct Blogger Publish

on:
  push:
    branches:
      - main
    paths:
      - 'roksana-vault-final.js'
      - '.github/workflows/blogger-direct-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roksana-vault-blogger-publish
  cancel-in-progress: false

jobs:
  publish-to-blogger:
    name: Publish Vault page through Blogger API v3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh Google token and publish Blogger page
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const {
            BLOGGER_BLOG_ID: BLOG_ID,
            BLOGGER_CLIENT_ID: CLIENT_ID,
            BLOGGER_CLIENT_SECRET: CLIENT_SECRET,
            BLOGGER_REFRESH_TOKEN: REFRESH_TOKEN
          } = process.env;

          const PAGE_TITLE = 'Roksana Nila Final Vault';
          const MARKER = '<!-- ROKSANA_NILA_FUTURE_VAULT_MANAGED -->';
          const EXPECTED_HOST = 'trttnews24bd.blogspot.com';
          const API_ROOT = 'https://www.googleapis.com/blogger/v3/blogs/' + encodeURIComponent(BLOG_ID || '');

          function fail(message) {
            console.error('PUBLISH FAILED: ' + message);
            process.exit(1);
          }

          for (const [name, value] of Object.entries({
            BLOGGER_BLOG_ID: BLOG_ID,
            BLOGGER_CLIENT_ID: CLIENT_ID,
            BLOGGER_CLIENT_SECRET: CLIENT_SECRET,
            BLOGGER_REFRESH_TOKEN: REFRESH_TOKEN
          })) {
            if (!value || !value.trim()) fail('Missing Repository Secret: ' + name);
          }

          async function readResponse(response) {
            const raw = await response.text();
            try { return raw ? JSON.parse(raw) : {}; }
            catch { return { message: raw.slice(0, 500) }; }
          }

          async function getAccessToken() {
            console.log('Requesting a fresh Google OAuth access token using the refresh token...');
            const body = new URLSearchParams({
              client_id: CLIENT_ID,
              client_secret: CLIENT_SECRET,
              refresh_token: REFRESH_TOKEN,
              grant_type: 'refresh_token'
            });

            let response;
            try {
              response = await fetch('https://oauth2.googleapis.com/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body,
                signal: AbortSignal.timeout(30000)
              });
            } catch (error) {
              fail('Could not reach Google OAuth token endpoint: ' + error.message);
            }

            const data = await readResponse(response);
            if (!response.ok || !data.access_token) {
              const detail = data.error_description || data.error || data.message || 'Google did not return an access token.';
              fail('Google OAuth refresh failed (HTTP ' + response.status + '): ' + detail);
            }
            console.log('Google OAuth access token generated successfully. Token value is hidden.');
            return data.access_token;
          }

          async function main() {
            const vaultPath = 'roksana-vault-final.js';
            if (!fs.existsSync(vaultPath)) fail('Missing ' + vaultPath + ' in the checked-out repository.');

            const vaultCode = fs.readFileSync(vaultPath, 'utf8');
            if (!vaultCode.trim()) fail('Vault JavaScript file is empty.');

            const requiredChecks = [
              ['Golapi', '#ff2e63'],
              ['Kathali', '#FFC300'],
              ['Piaji', '#AF7AC5'],
              ['blogspot domain lock', 'trttnews24bd.blogspot.com'],
              ['root domain lock', 'trttnews24bd.com'],
              ['www domain lock', 'www.trttnews24bd.com']
            ];
            for (const [label, value] of requiredChecks) {
              if (!vaultCode.includes(value)) fail('Vault source check failed: missing ' + label + ' value (' + value + ').');
            }
            console.log('Vault source and signature-color checks passed; source file will not be modified.');

            const accessToken = await getAccessToken();

            async function bloggerApi(path, options = {}) {
              const url = new URL(API_ROOT + path);
              let response;
              try {
                response = await fetch(url, {
                  method: options.method || 'GET',
                  headers: {
                    Authorization: 'Bearer ' + accessToken,
                    Accept: 'application/json',
                    ...(options.body ? { 'Content-Type': 'application/json' } : {})
                  },
                  body: options.body ? JSON.stringify(options.body) : undefined,
                  signal: AbortSignal.timeout(30000)
                });
              } catch (error) {
                fail('Blogger API network error: ' + error.message);
              }

              const data = await readResponse(response);
              if (!response.ok) {
                const detail = data.error?.message || data.message || 'No error details returned.';
                if (response.status === 401) {
                  fail('Blogger API returned HTTP 401. The refresh token may not include Blogger access, or the OAuth grant may be revoked.');
                }
                if (response.status === 403) {
                  fail('Blogger API returned HTTP 403. Check Blogger API enablement, account permissions and the OAuth scope https://www.googleapis.com/auth/blogger. Google message: ' + detail);
                }
                fail('Blogger API HTTP ' + response.status + ': ' + detail);
              }
              return data;
            }

            console.log('Verifying target Blogger blog...');
            const blog = await bloggerApi('');
            const blogUrl = blog.url ? new URL(blog.url) : null;
            if (!blogUrl || blogUrl.hostname.toLowerCase() !== EXPECTED_HOST) {
              fail('BLOGGER_BLOG_ID does not resolve to ' + EXPECTED_HOST + '. No page was changed.');
            }
            console.log('Target blog verified: ' + EXPECTED_HOST);

            const htmlContent = MARKER + '\\n' +
              '<div id="roksana-vault-loading" style="padding:16px;text-align:center">Loading Roksana Nila Vault…</div>\\n' +
              '<script type="text/javascript">\\n' + vaultCode + '\\n</script>';

            console.log('Searching for an existing managed Vault page...');
            let pageToken;
            let existingPage = null;
            do {
              const query = new URLSearchParams({ maxResults: '100', fetchBodies: 'true' });
              if (pageToken) query.set('pageToken', pageToken);
              const list = await bloggerApi('/pages?' + query.toString());
              const items = Array.isArray(list.items) ? list.items : [];
              existingPage = items.find(page =>
                page.title === PAGE_TITLE ||
                (typeof page.content === 'string' && page.content.includes(MARKER))
              ) || null;
              pageToken = list.nextPageToken || undefined;
            } while (!existingPage && pageToken);

            let page;
            if (existingPage) {
              console.log('Existing Vault page found; updating it...');
              page = await bloggerApi('/pages/' + encodeURIComponent(existingPage.id) + '?publish=true', {
                method: 'PUT',
                body: {
                  id: existingPage.id,
                  title: PAGE_TITLE,
                  content: htmlContent
                }
              });
            } else {
              console.log('No existing Vault page found; inserting a new page...');
              page = await bloggerApi('/pages?isDraft=false', {
                method: 'POST',
                body: { title: PAGE_TITLE, content: htmlContent }
              });
            }

            if (!page.id || page.status !== 'LIVE' || !page.url) {
              fail('Blogger did not confirm a LIVE page with a public URL. Returned status: ' + (page.status || 'unknown'));
            }

            console.log('Blogger API confirmed status: ' + page.status);
            console.log('Published page URL: ' + page.url);

            const publicResponse = await fetch(page.url, {
              headers: { 'User-Agent': 'RoksanaVault-GitHubActions/1.0' },
              redirect: 'follow',
              signal: AbortSignal.timeout(30000)
            });
            if (!publicResponse.ok) {
              fail('Blogger reports LIVE, but public URL check returned HTTP ' + publicResponse.status + '.');
            }
            console.log('Public page returned HTTP ' + publicResponse.status + '.');
            console.log('SUCCESS: Roksana Nila Final Vault is published on Blogger.');
          }

          main().catch(error => fail(error.message || String(error)));
          NODE
