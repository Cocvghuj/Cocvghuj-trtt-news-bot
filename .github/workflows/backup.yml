name: MULTI-TRILLION BACKUP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to Backup Repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "Multi-Trillion Bot 787950"
          git config user.email "bot@cdn.fdbdx.com"
          git remote add backup https://x-access-token:${GH_PAT}@github.com/Cocvghuj/Cocvghuj-trtt-news-bot-BACKUP-787950.git
          git push backup main --force
