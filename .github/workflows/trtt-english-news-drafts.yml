# Marker: 787950 LOCKED
name: TRTT News - Publish to Both Blogger Sites

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trtt-daily-draft
  cancel-in-progress: false

jobs:
  draft:
    name: Generate one article and save it as DRAFT on both blogs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and validate draft content
        run: |
          python -m py_compile trtt_787950_master.py scripts/publish_news.py
          python -c "from trtt_787950_master import build_content; s=build_content('Rome to Cagliari'); required=['ghost-esim','787950','photo-1501785888041-af3ef285b470','aviasales.tp.st','klook.tp.st','airalo.tp.st','gettransfer.tp.st','amzn.to/4shg6Hn','Live App:','Make every journey feel effortless.','EC Regulation 261/2004','Published:','Updated:','Sanluri']; missing=[x for x in required if x not in s]; assert not missing, missing; assert s.index('Live App:') > s.index('Marker 787950 Locked')"
      - name: Require both Blogger accounts
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID || vars.BLOGGER_BLOG_ID }}
          FLIGHTSCOUTPRO_BLOG_ID: ${{ secrets.FLIGHTSCOUTPRO_BLOG_ID || vars.FLIGHTSCOUTPRO_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for name in BLOGGER_BLOG_ID FLIGHTSCOUTPRO_BLOG_ID BLOGGER_CLIENT_ID BLOGGER_CLIENT_SECRET BLOGGER_REFRESH_TOKEN; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing required setting: $name"; exit 1; fi
          done
          if [[ "$BLOGGER_BLOG_ID" == "$FLIGHTSCOUTPRO_BLOG_ID" ]]; then echo "::error::Two distinct Blogger IDs are required."; exit 1; fi
      - name: Create one daily draft on both Blogger sites
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID || vars.BLOGGER_BLOG_ID }}
          FLIGHTSCOUTPRO_BLOG_ID: ${{ secrets.FLIGHTSCOUTPRO_BLOG_ID || vars.FLIGHTSCOUTPRO_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          TRAVEL_PAYOUT_MARKER: '787950'
        run: python scripts/publish_news.py
      - name: Save daily draft history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafted_history.txt
          if git diff --cached --quiet; then echo "No new daily draft history."; else
            git commit -m "Record daily Blogger draft history [skip ci]"
            git push origin HEAD:main
          fi
