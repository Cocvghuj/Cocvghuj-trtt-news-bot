# Marker: 787950 LOCKED
name: TRTT News - Publish to Both Blogger Sites

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trtt-daily-draft
  cancel-in-progress: false

jobs:
  draft:
    name: Generate one article and save it as DRAFT on both blogs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and validate draft content
        run: |
          python -m py_compile trtt_787950_master.py scripts/publish_news.py
          python - <<'PY'
          import json
          from pathlib import Path
          from trtt_787950_master import build_content, _plain_word_count
          queue = json.loads(Path("news/queue/latest.json").read_text(encoding="utf-8"))
          assert queue["batch_size"] == 1 and queue["isDraft"] is True
          assert len(queue["routes"]) == 1
          route = queue["routes"][0]
          assert route["date"] == "2026-11-06" and route["isDraft"] is True
          content = build_content(route, "6 November 2026")
          assert "EC 261/2004" in content and "EC Regulation 261/2004" not in content
          assert _plain_word_count(content) >= 800
          assert "<img src=\"https://images.unsplash.com/" in content
          assert "787950 LOCKED" in content
          assert "TRTT VoyageHub Showroom" in content
          assert "amzn.to/4shg6Hn?marker=787950" in content
          assert "https://cocvghuj-trtt-news-bot.vercel.app" in content
          assert "amzn.to/4shg6Hn?marker=787950" in content
          print("CONTENT-ONLY CHECK PASSED: one dated route, 800+ words, image, EC 261/2004, marker, Vercel link and affiliate. No Blogger API call was made in this validation step.")
          PY
      - name: Require both Blogger accounts
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID || vars.BLOGGER_BLOG_ID }}
          FLIGHTSCOUTPRO_BLOG_ID: ${{ secrets.FLIGHTSCOUTPRO_BLOG_ID || vars.FLIGHTSCOUTPRO_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for name in BLOGGER_BLOG_ID FLIGHTSCOUTPRO_BLOG_ID BLOGGER_CLIENT_ID BLOGGER_CLIENT_SECRET BLOGGER_REFRESH_TOKEN; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing required setting: $name"; exit 1; fi
          done
          if [[ "$BLOGGER_BLOG_ID" == "$FLIGHTSCOUTPRO_BLOG_ID" ]]; then echo "::error::Two distinct Blogger IDs are required."; exit 1; fi
      - name: Create one daily draft on both Blogger sites
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID || vars.BLOGGER_BLOG_ID }}
          FLIGHTSCOUTPRO_BLOG_ID: ${{ secrets.FLIGHTSCOUTPRO_BLOG_ID || vars.FLIGHTSCOUTPRO_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          TRAVEL_PAYOUT_MARKER: '787950'
        run: |
          set -euo pipefail
          python scripts/publish_news.py
      - name: Save daily draft history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafted_history.txt
          if git diff --cached --quiet; then echo "No new daily draft history."; else
            git commit -m "Record daily Blogger draft history [skip ci]"
            git push origin HEAD:main
          fi
