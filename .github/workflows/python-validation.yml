# Marker: 787950 LOCKED
name: TRTT Python Validation

on:
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/python-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/python-validation.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
