name: Bot Admin - Safe Promote

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      promote_task:
        description: 'Task'
        default: 'Promote GitHub Pages - organize + README shine + fix links'
        
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  bot-admin:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout - Full Access
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Engine
        run: |
          pip install requests openai google-genai
          echo "Engine Ready - Marker 787950"

      - name: Bot Promote - ${{ github.event.inputs.promote_task }}
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          TRAVEL_MARKER: 787950
          BLOG: trttnews24bd.blogspot.com
        run: |
          echo "🤖 Bot running with Marker 787950 Locked"
          echo "Task: ${{ github.event.inputs.promote_task }}"
          echo "Blog: trttnews24bd.blogspot.com"
          
          # Fix White Screen + Typo
          find . -type f \( -name "*.html" -o -name "*.md" -o -name "*.py" \) -exec sed -i 's/tpo\.lv/tp.st/g' {} \; 2>/dev/null || true
          find . -type f \( -name "*.html" -o -name "*.md" -o -name "*.py" \) -exec sed -i 's/tlZcbMOB/tIZcbMOB/g' {} \; 2>/dev/null || true
          find . -type f \( -name "*.html" \) -exec sed -i 's/tp\.st\/\([A-Za-z0-9]*\)"/tp.st\/\1?marker=787950\&sub_id=bot_787950"/g' {} \; 2>/dev/null || true
          
          echo "✅ Links Fixed: tp.st?marker=787950 + tIZcbMOB"
          
          # Run Bot Engine - Try engine/ first then root
          if [ -f "engine/bot_social_engine.py" ]; then
            python engine/bot_social_engine.py || echo "Engine bot skipped"
          elif [ -f "bot_social_engine.py" ]; then
            python bot_social_engine.py || echo "Root bot skipped"
          fi
          
          if [ -f "engine/main.py" ]; then
            python engine/main.py || echo "Engine main skipped"
          elif [ -f "main.py" ]; then
            python main.py || echo "Root main skipped"
          fi
          
          echo "✅ Bot Promote Done - trttnews24bd"
          
      - name: Commit - Bot Auto Push
        run: |
          git config user.name "TRTT Bot Admin"
          git config user.email "bot@trttnews24bd.com"
          git add -A
          git commit -m "Bot Promote: ${{ github.event.inputs.promote_task }} - marker 787950 locked - tp.st fixed - tIZcbMOB" || echo "No changes"
          git push

      - name: Deploy to Pages
        id: deployment
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: '.github,engine,content,.base44,docker,scripts,*.py,*.json,node_modules'

      - name: Success
        run: |
          echo "🚀 Promoted!"
          echo "Blog: https://trttnews24bd.blogspot.com"
          echo "Vercel: https://cocvghuj-trtt-news-bot.vercel.app"
          echo "Marker: 787950 Locked - tp.st Direct - tIZcbMOB Fixed"
