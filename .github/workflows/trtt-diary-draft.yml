name: Create Blogger drafts on both blogs (approval required)

on:
  workflow_dispatch:
    inputs:
      allow_draft:
        description: "I approve creating the prepared posts as DRAFTS on both blogs (never publish)"
        required: true
        type: boolean
        default: false

concurrency:
  group: blogger-two-blog-drafts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-both-drafts:
    if: ${{ inputs.allow_draft == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create drafts on TRTT and FlightScoutPro only
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          FLIGHTSCOUTPRO_BLOG_ID: ${{ secrets.FLIGHTSCOUTPRO_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python post_diary_draft.py
