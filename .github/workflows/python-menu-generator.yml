name: Python Menu Generator - GitHub Style - Marker 787950
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Daily 6AM - 7AM Italy
  workflow_dispatch:

jobs:
  generate-menu:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run Python Menu Generator - GitHub Style
        run: |
          python engine/trtt_menu_generator.py
          echo "🐍 Python generated menu - Marker 787950 Locked"
      - name: Commit and Push
        run: |
          git config --local user.email "engrtaher2017@gmail.com"
          git config --local user.name "Abu Taher - Python Love"
          git add blog.json trtt-auto-sync.js
          git commit -m "🐍 Python + GitHub Style - 2 Menus Only - Read The Blog + Explore Your Life - Marker 787950 + tIZcbMOB Fixed - Generated by Python" || echo "No changes"
          git push
