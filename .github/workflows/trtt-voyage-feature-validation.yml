name: TRTT Voyage Feature Branch Validation

on:
  push:
    branches:
      - feature/trtt-voyage-blog-refresh-20261124
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trtt-voyage-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate TRTT assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate control JSON
        run: node -e "JSON.parse(require('fs').readFileSync('blog-control.json', 'utf8')); console.log('PASS: blog-control.json is valid JSON')"

      - name: Validate TRTT theme CSS braces
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const css = fs.readFileSync('trtt-theme.css', 'utf8');
          let depth = 0;
          for (let i = 0; i < css.length; i++) {
            if (css[i] === '{') depth++;
            if (css[i] === '}') depth--;
            if (depth < 0) throw new Error('Unmatched closing CSS brace at character ' + i);
          }
          if (depth !== 0) throw new Error('Unbalanced CSS braces: ' + depth);
          if (!css.includes('@media (max-width: 768px)')) throw new Error('Mobile breakpoint missing');
          if (!css.includes('@media (prefers-reduced-motion: reduce)')) throw new Error('Reduced-motion rule missing');
          console.log('PASS: TRTT theme CSS structure, mobile and reduced-motion rules');
          NODE

      - name: Run repository tests
        run: npm test

      - name: Build static assets
        run: npm run build

      - name: Confirm build output
        run: test -f dist/index.html && echo "PASS: dist/index.html exists"
