name: TRTT Safe Validation - V106 Protected (Owner Merge Only)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-protected-assets:
    if: contains(github.event.pull_request.labels.*.name, 'auto')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check only approved V106 files
        run: |
          git fetch origin main
          FILES=$(git diff --name-only origin/main...HEAD)
          echo "$FILES"
          for f in $FILES; do
            case "$f" in
              trtt-control/*|README.md)
                echo "OK: $f"
                ;;
              *)
                echo "BLOCKED: $f"
                exit 1
                ;;
            esac
          done

      - name: Check V106 marker
        run: |
          grep -r "TRTT MAC-787950 LOCKED" trtt-control/ || { echo "V106 Marker Missing!"; exit 1; }
          echo "V106 OK"

      - name: Check JavaScript syntax
        run: |
          shopt -s nullglob
          for f in trtt-control/*.js; do
            echo "Checking $f"
            node --check "$f" || exit 1
          done
          echo "JS Syntax OK"

      - name: Preserve owner merge gate
        run: |
          echo "Validation complete. This workflow never merges pull requests."
          echo "Only the repository owner may review and merge."
