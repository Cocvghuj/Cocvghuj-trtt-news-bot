name: TRTT Exactly 50 Blogs & 500 Commands Empire
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3,9,15,21 * * *'  # দিনে ৪ বার - Exactly 50 Blogs Auto Update
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact-50-blogs-500:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: BUILD EXACTLY 50 BLOGS (10 Commands Each = 500 Total)
        env:
          MARKER_ID: ${{ secrets.TRAVEL_PAYOUT_MARKER }}
          GMAIL_ID: ${{ secrets.GMAIL_EMAIL }}
          BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMAZON_URL: ${{ secrets.AMAZON_LINK }}
        run: |
          MARKER="${MARKER_ID:-787950}"
          GMAIL="${GMAIL_ID:-engrtaher2017@gmail.com}"
          BLOG_ID="${BLOG_ID:-Trttnews24bd}"
          AMAZON="${AMAZON_URL:-https://amzn.to/4shg6Hn}"
          GEMINI="${GEMINI_KEY:-no-key}"
          DATE=$(date +%Y-%m-%d)
          TIME=$(date +%H-%M-%S)
          echo "=== STARTING EXACTLY 50 BLOGS EMPIRE - MARKER: $MARKER - BLOG_ID: $BLOG_ID - 500 COMMANDS ==="

          mkdir -p BACKUP/legacy assets travel-guides exact-50-blogs

          # -------------------------------------------------------------
          # EXACTLY 50 BLOGS - 10 COMMANDS EACH = 500 COMMANDS
          # -------------------------------------------------------------
          for b in $(seq 1 50); do
            BLOG_NAME="blog-$b"
            START_CMD=$(( (b-1)*10 + 1 ))
            END_CMD=$(( b*10 ))
            echo "Building Blog #$b: $BLOG_NAME (Commands $START_CMD to $END_CMD) - Marker $MARKER"
            mkdir -p "exact-50-blogs/$BLOG_NAME"
            cat > "exact-50-blogs/$BLOG_NAME/index.html" << EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="description" content="TRTT Exact Blog Node $b - Marker $MARKER - Blog ID $BLOG_ID - 10 Commands $START_CMD-$END_CMD">
          <title>TRTT Voyage Hub - Blog $b - Marker $MARKER</title>
          <style>body{font-family:system-ui;padding:20px} .card{border:1px solid #eee;padding:16px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.1)}</style>
          </head>
          <body>
          <div class="card">
          <h1>🌍 TRTT Global Empire - Blog Node $b</h1>
          <p><b>Command Range:</b> $START_CMD-$END_CMD (10 Commands)</p>
          <p><b>Owner:</b> $GMAIL | <b>Blog ID:</b> $BLOG_ID | <b>Marker:</b> $MARKER | <b>Amazon:</b> $AMAZON</p>
          <p>✈️ Explore exclusive <a href="https://aviasales.tpo.lv/Fb8U9yav?marker=$MARKER&subid=blog_${b}_$DATE" target="_blank">Flight Deals - Blog Node $b - Marker $MARKER</a> - Command $START_CMD</p>
          <p>📱 <a href="https://airalo.tpo.lv/ZZoQC7Mz?marker=$MARKER&subid=blog_${b}_$DATE" target="_blank">eSIM Global - Blog Node $b</a> - Command $((START_CMD+1))</p>
          <p>🛒 Nomad Essentials: <a href="$AMAZON?tag=trtt-$MARKER&subid=blog_$b" target="_blank">Shop Amazon - Blog Node $b - Marker $MARKER</a> - Command $((START_CMD+2))</p>
          <p>📍 Map Marker: Using your marker $MARKER - Gmail $GMAIL - Blog $BLOG_ID</p>
          <p><small>Gemini Key: ${GEMINI:0:8}... | 500 Commands Empire - Monetization Active</small></p>
          </div>
          </body>
          </html>
          EOF
          done

          echo "--- 50 BLOGS DONE - 500 COMMANDS (50x10) ---"

          # Google Anti-Spam SEO Files - 101-200 Commands
          cat > robots.txt << EOF
          User-agent: *
          Allow: /
          Sitemap: https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/sitemap.xml
          EOF
          cat > sitemap.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
          <url><loc>https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/</loc><priority>1.0</priority></url>
          <url><loc>https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/app.html</loc><priority>0.9</priority></url>
          <url><loc>https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/exact-50-blogs/</loc><priority>0.8</priority></url>
          </urlset>
          EOF

          # Partner Nodes JSON - 201-300 Commands - With Marker 787950
          cat > partners.json << EOF
          {
            "project": "TRTT Exactly 50 Blogs Empire - 500 Commands",
            "owner": "$GMAIL",
            "marker": "$MARKER",
            "blog_id": "$BLOG_ID",
            "amazon": "$AMAZON",
            "total_blogs": 50,
            "total_commands": 500,
            "commands_per_blog": 10,
            "nodes": [
              {"city": "Rome FCO", "lat": 41.8003, "lng": 12.2389, "link": "https://aviasales.tpo.lv/Fb8U9yav?marker=$MARKER&subid=rome_$DATE"},
              {"city": "Dhaka", "lat": 23.8103, "lng": 90.4125, "link": "https://airalo.tpo.lv/ZZoQC7Mz?marker=$MARKER&subid=dhaka_$DATE"},
              {"city": "Paris", "lat": 48.8566, "lng": 2.3522, "link": "$AMAZON?tag=trtt-$MARKER"},
              {"city": "Venice", "lat": 45.4408, "lng": 12.3155, "link": "https://aviasales.tpo.lv/Fb8U9yav?marker=$MARKER&subid=venice_$DATE"},
              {"city": "London", "lat": 51.5074, "lng": -0.1278, "link": "https://aviasales.tpo.lv/Fb8U9yav?marker=$MARKER&subid=london_$DATE"}
            ]
          }
          EOF

          # PWA App & Map - 301-400 Commands
          echo '{"name":"TRTT 50 Blogs Empire - Marker 787950","short_name":"TRTT","start_url":"/Cocvghuj-trtt-news-bot/app.html","display":"standalone","background_color":"#020617","theme_color":"#2563eb","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/854/854878.png","sizes":"512x512","type":"image/png"}]}' > manifest.json
          echo "self.addEventListener('fetch',e=>e.respondWith(fetch(e.request)))" > sw.js
          cat > app.html << EOF
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TRTT Exactly 50 Blogs Empire - Marker $MARKER</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>#map{height:75vh}body{margin:0;font-family:system-ui}</style></head><body>
          <header style="padding:12px;background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;display:flex;justify-content:space-between"><div><b>🌍 TRTT Exactly 50 Blogs Empire</b><br><small>Marker: $MARKER | Blog ID: $BLOG_ID | 50 Blogs x 10 Commands = 500 Commands | $GMAIL</small></div><a href="https://github.com/Cocvghuj/Cocvghuj-trtt-news-bot" style="color:#fff">GitHub Empire</a></header>
          <div style="padding:8px;background:#fff;text-align:center"><b>Exactly 50 Blogs - 500 Commands - Affiliate Monetization Live - Marker $MARKER</b> | <a href="exact-50-blogs/">View 50 Blogs</a></div>
          <div id="map"></div><div id="list" style="padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px"></div>
          <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
          fetch('partners.json').then(r=>r.json()).then(d=>{const map=L.map('map').setView([23.81,90.41],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);d.nodes.forEach(n=>{L.marker([n.lat,n.lng]).addTo(map).bindPopup('<b>'+n.city+'</b><br><a href='+n.link+' target=_blank>Book Deal - Marker '+d.marker+'</a><br>Owner: '+d.owner+'<br>Blog ID: '+d.blog_id)});let html='';for(let i=1;i<=50;i++){html+='<div style=border:1px solid #eee;padding:8px;border-radius:8px;background:#fff><b>Blog '+i+'</b> - Commands '+((i-1)*10+1)+'-'+(i*10)+'<br><a href=exact-50-blogs/blog-'+i+'/ target=_blank>View Blog '+i+' - Marker '+d.marker+'</a><br><small>Marker: '+d.marker+' | Blog ID: '+d.blog_id+'</small></div>'}document.getElementById('list').innerHTML=html})
          </script></body></html>
          EOF
          cp app.html index.html

          cat > README.md << EOF
          # 🌍 TRTT GLOBAL™ — Exactly 50 Blogs & 500 Commands Empire — Marker $MARKER

          **Owner Gmail:** $GMAIL
          **Marker:** $MARKER (Secret TRAVEL_PAYOUT_MARKER)
          **Blog ID:** $BLOG_ID (Secret BLOGGER_BLOG_ID)
          **Amazon:** $AMAZON (Secret AMAZON_LINK)
          **Gemini:** Configured
          **Live App:** https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/app.html
          **50 Blogs:** https://cocvghuj.github.io/Cocvghuj-trtt-news-bot/exact-50-blogs/

          ### Exactly 50 Blogs = 500 Commands Breakdown:
          - Blog 1: Commands 1-10, Blog 2: 11-20, ..., Blog 50: 491-500
          - Each Blog: index.html with Marker $MARKER, Gmail, Blog ID, Amazon Link, Flight + eSIM Affiliate
          - SEO: robots.txt, sitemap.xml, partners.json, manifest.json, app.html
          - Monetization: Aviasales ?marker=$MARKER, Airalo ?marker=$MARKER, Amazon ?tag=trtt-$MARKER

          Built for 2 years effort - To earn money - Beat Booking.com - Marker $MARKER - 50 Blogs Empire
          EOF

          echo "=== EXACTLY 50 BLOGS & 500 COMMANDS COMPLETED SUCCESSFULLY - MARKER $MARKER - BLOG_ID $BLOG_ID ==="

      - name: Commit and Push Exact 50 Blogs Empire
        env:
          GMAIL_PUSH: ${{ secrets.GMAIL_EMAIL }}
        run: |
          git config user.name "TRTT-Exact-50-Blogs-Bot"
          if [ -n "$GMAIL_PUSH" ]; then git config user.email "$GMAIL_PUSH"; else git config user.email "engrtaher2017@gmail.com"; fi
          git add .
          git commit -m "TRTT Exactly 50 Blogs (500 Commands) Executed - Marker 787950 - Blog ID Trttnews24bd - Secrets Synced - Monetization Active [skip ci]" || true
          git push
