name: GitHub to Blogger Content Sync

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'pages/trttnews24bd/**'
      - 'scripts/sync_blogger_content.py'
      - 'requirements.txt'
      - '.github/workflows/blogger-content-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trtt-blogger-content-sync
  cancel-in-progress: false

jobs:
  publish-github-content:
    name: Publish GitHub Posts and Pages to Blogger
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Blogger publishing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync GitHub source content to Blogger
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python scripts/sync_blogger_content.py
