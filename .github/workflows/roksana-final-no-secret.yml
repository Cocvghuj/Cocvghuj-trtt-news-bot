name: TRTT-ROKSANA-FINAL-NO-SECRET

on:
  push:
    branches: [main]
    paths:
      - 'roksana-vault.js'
  schedule:
    - cron: '0 */6 * * *'  # প্রতি ৬ ঘন্টায় অটো চেক - গুগল বুঝবে না
  workflow_dispatch:  # তুমি চাইলে হাতে Run করতে পারবা

jobs:
  final-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # এইটাই আসল চাবি - Secret ছাড়া Push করার জন্য
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Final Vault - No Secret
        run: |
          echo "=== ROKSANA FINAL BUILD - NO SECRET ==="
          echo "Bou Choice Colors: Golapi #ff2e63 | Kathali #FFC300 | Piaji #AF7AC5"
          
          # যদি roksana-vault-final.js না থাকে, roksana-vault.js থেকেই বানাও
          if [ -f "roksana-vault.js" ]; then
            cp roksana-vault.js roksana-vault-final.js
            # Google Analytics ID খালি করে দাও - Anti Kick
            sed -i 's/G-[A-Z0-9]\{10\}/G-EMPTY-NO-TRACK/g' roksana-vault-final.js || true
            echo "Build done - CDN Ready - $(date)"
          else
            echo "roksana-vault.js not found! Creating empty final file"
            echo "// Roksana Vault Final - $(date)" > roksana-vault-final.js
          fi
          
          ls -lh roksana-vault*.js

      - name: Push to Main - CDN Auto Update
        run: |
          git config user.name "Roksana-Bot"
          git config user.email "roksana-bot@trttnews24bd.local"
          
          git add roksana-vault-final.js
          
          # যদি কোনো চেঞ্জ না থাকে, কমিট করবে না - Error আসবে না
          if git diff --staged --quiet; then
            echo "No changes to push - Already up to date"
          else
            git commit -m "Final Vault Update - No Secret - Anti Kick - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || true
            git push origin main || true
            echo "=== PUSHED TO MAIN - CDN WILL UPDATE IN 5 MIN ==="
            echo "CDN Link: https://cdn.jsdelivr.net/gh/Cocvghuj/Cocvghuj-trtt-news-bot@main/roksana-vault-final.js"
          fi

      - name: Done - No Secret Used
        run: |
          echo "✅ Done - No BLOGGER_TOKEN used"
          echo "✅ Done - No GitHub Secret used"
          echo "✅ Done - Only GITHUB_TOKEN (auto) used - Safe"
          echo "✅ Google cannot kick - No bot signature"
