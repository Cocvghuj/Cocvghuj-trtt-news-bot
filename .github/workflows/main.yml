name: Daily Travel Article

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-article:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run app
        run: |
          python - <<'PY'
          import time
          time.sleep(12)
          PY
          python main.py
          echo "Pushed 1 article"

      - name: Commit generated article
        if: ${{ success() }}
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "auto: add daily travel article"
