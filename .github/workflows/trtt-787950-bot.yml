name: TRTT Single-Draft

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Queue date (YYYY-MM-DD); blank uses today in Europe/Rome'
        required: false
        type: string

concurrency:
  group: trtt-single-draft
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-one-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check Rome local time
        id: clock
        shell: bash
        run: |
          echo "hour=$(TZ=Europe/Rome date +%H)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: github.event_name == 'workflow_dispatch' || steps.clock.outputs.hour == '07'
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.clock.outputs.hour == '07'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.clock.outputs.hour == '07'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression tests and static build checks
        if: github.event_name == 'workflow_dispatch' || steps.clock.outputs.hour == '07'
        run: |
          python -m unittest discover -s tests -v
          npm test
          npm run build

      - name: Create one verified Blogger draft
        if: github.event_name == 'workflow_dispatch' || steps.clock.outputs.hour == '07'
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          TRTT_TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: python trtt_787950_master.py

      - name: Skip outside 07:00 Europe/Rome
        if: github.event_name == 'schedule' && steps.clock.outputs.hour != '07'
        run: "echo 'Skipped: not 07:00 Europe/Rome.'"
