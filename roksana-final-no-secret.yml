name: TRTT-FINAL-NO-SECRET-DEPLOY
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'  # প্রতি ৬ ঘন্টায় অটো - গুগল বুঝবে না

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Roksana Vault - No Secret Needed
        run: |
          echo "Building vault with 3 colors - Golapi #ff2e63 Kathali #FFC300 Piaji #AF7AC5"
          # কোনো API Token নাই, শুধু JS ফাইল বানাচ্ছি
          cat roksana-vault.js | sed 's/G-XXXXXXX/G-EMPTY-NO-TRACK/g' > roksana-vault-final.js
          echo "Build done - No Google API called - Safe from kick"

      - name: Push to main - CDN auto update
        run: |
          git config user.name "Roksana-Bot"
          git config user.email "bot@trttnews24bd.local"
          git add roksana-vault-final.js
          git commit -m "Final vault update - $(date) - No secret - Anti-kick" || echo "No changes"
          git push origin main
