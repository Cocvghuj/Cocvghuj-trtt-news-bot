     Safe to keep in an older Blogger HTML gadget; duplicate loads are prevented. -->
<script>
(function () {
  "use strict";
  var host = String(window.location.hostname || "").toLowerCase();
  if (host !== "trttnews24bd.blogspot.com" &&
      host !== "trttnews24bd.com" &&
      host !== "www.trttnews24bd.com") return;
  if (document.getElementById("roksana-vault-loader")) return;
  var script = document.createElement("script");
  script.id = "roksana-vault-loader";
  script.async = true;
  script.src = "https://cocvghuj-trtt-news-bot.vercel.app/roksana-vault.js";
  (document.head || document.documentElement).appendChild(script);
}());
</script>
